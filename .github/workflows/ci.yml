name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

# Runs on main never overlap, so production is deployed in push order; on other
# branches a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  VERCEL_CLI: vercel@62.1.0

jobs:
  # On main only: can the checks be skipped because this exact tree was already tested? (scripts/ci/tested-tree.sh: HEAD is a
  # merge commit with the tree of its second parent, and that parent's "Checks" succeeded.) It only ever skips work; whatever it
  # cannot confirm runs the checks. Any other branch goes straight to the checks.
  tested-tree:
    name: Tested tree
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      tested_sha: ${{ steps.decide.outputs.tested_sha }}
    steps:
      # The merge commit and both its parents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Decide whether this tree was already tested
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci/tested-tree.sh

  # The three checks jobs (Static, Database, Browser), run at once (checks.yml). Skipped when the tested-tree check says so.
  # `!cancelled()` lets this run when tested-tree itself was skipped (every branch but main) or failed (then skip is empty).
  suite:
    name: Check suite
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.skip != 'true' }}
    uses: ./.github/workflows/checks.yml

  # The one result everything else waits for and watches: branch protection, the preview gate, and the tested-tree check of a
  # later merge all read the check run named "Checks". It succeeds when the suite succeeded, or when the suite was skipped
  # because the tree was already tested.
  checks:
    name: Checks
    needs: [tested-tree, suite]
    # not cancelled(): a run replaced by a newer push stays "cancelled" and is not reported as a failed Checks.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SKIP: ${{ needs.tested-tree.outputs.skip }}
      TESTED_SHA: ${{ needs.tested-tree.outputs.tested_sha }}
      SUITE_RESULT: ${{ needs.suite.result }}
    steps:
      - name: Report the result of the checks
        run: |
          if [ "$SKIP" = true ] && [ "$SUITE_RESULT" = skipped ]; then
            echo "tested at $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$SUITE_RESULT" = success ]; then
            echo "Static, Database and Browser succeeded." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Checks failed::The check suite ended as '$SUITE_RESULT' (Static, Database and Browser must all succeed)."
            exit 1
          fi

  # The Vercel CLI reads VERCEL_ORG_ID and VERCEL_PROJECT_ID from the environment. VERCEL_TOKEN
  # is given only to the steps that call the Vercel API, never to npm installs, builds or tests.
  # Previews are built by preview.yml, on demand.

  production:
    name: Vercel production
    needs: checks
    # Explicit on purpose: an `if` without a status function gets an implicit success() that also looks at the skipped
    # `suite` job further up the chain (a tested tree), and production would be skipped while Checks passes.
    # needs.checks.result is success only when the suite succeeded or was skipped for an already tested tree.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The production environment holds VERCEL_TOKEN and PRODUCTION_DATABASE_URL and
    # accepts deployments from main only (repository settings > Environments), so a
    # push to any other branch cannot read them. The secrets checks below read
    # `secrets.*` and work whether a secret is repository- or environment-scoped.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check Vercel and database settings
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_DATABASE: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
        run: |
          missing=()
          [ "$HAS_TOKEN" = true ] || missing+=("secret VERCEL_TOKEN")
          [ "$HAS_DATABASE" = true ] || missing+=("secret PRODUCTION_DATABASE_URL")
          [ -n "$VERCEL_ORG_ID" ] || missing+=("variable VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("variable VERCEL_PROJECT_ID")
          [ -n "$PRODUCTION_URL" ] || missing+=("variable PRODUCTION_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Production not deployed::The repository has no ${missing[*]}."
            exit 1
          fi
          if [[ "$PRODUCTION_URL" != https://* ]]; then
            echo "::error title=Production not deployed::The variable PRODUCTION_URL must be a full https:// URL."
            exit 1
          fi
      # Full history: a contract note's release must be an ancestor of production.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --global "$VERCEL_CLI"
      - name: Check this commit is still the head of main
        id: head
        run: scripts/ci/main-head.sh
      - name: Record the current production deployment
        id: previous
        if: steps.head.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: scripts/ci/rollback-target.sh
      - if: steps.head.outputs.current == 'true'
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - if: steps.head.outputs.current == 'true'
        run: vercel build --prod
        env:
          APP_VERSION: ${{ github.sha }}
      # Migrations reach production before the app that needs them (AD-15). Each
      # runs in its own transaction; a failure rolls that one back and stops the
      # job here, so nothing is deployed and production keeps the previous
      # release. Edits to applied migrations, and destructive changes whose
      # contract release is not yet in production, stop it before anything runs.
      # Previews never get this secret and never migrate.
      - name: Migrate the production database
        if: steps.head.outputs.current == 'true'
        run: npm run db:migrate -- --check-destructive
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      # Deploy without taking the production domains, then promote explicitly:
      # after an instant rollback Vercel stops assigning them automatically.
      - name: Deploy
        id: deploy
        if: steps.head.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --archive=tgz --prod --skip-domain --json | jq -er .url)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Checked again just before promoting: main may have moved during the build.
      - name: Check this commit is still the head of main before promoting
        id: head_at_promote
        if: steps.deploy.outcome == 'success'
        run: scripts/ci/main-head.sh
      # promote and rollback ignore VERCEL_ORG_ID, so they are given the team as --scope.
      - name: Promote to production
        if: steps.head_at_promote.outputs.current == 'true'
        run: vercel promote "$DEPLOYMENT_URL" --yes --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
      # Runs even if promote failed: the promotion may still have gone through.
      - name: Smoke check production
        id: smoke
        if: ${{ !cancelled() && steps.head_at_promote.outputs.current == 'true' }}
        run: npm run test:smoke
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL }}
          EXPECTED_VERSION: ${{ github.sha }}
          SMOKE_SEARCH: "off"
      - name: Roll back after a failed smoke check
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          PREVIOUS_DEPLOYMENT: ${{ steps.previous.outputs.id }}
        run: |
          {
            echo "## Production smoke check failed"
            echo
            echo "Deployment $DEPLOYMENT_URL (commit $GITHUB_SHA) failed the smoke check against $PRODUCTION_URL; the failing checks are in the \"Smoke check production\" step."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$PREVIOUS_DEPLOYMENT" ]; then
            echo "**Not rolled back: there was no earlier production deployment. Production is serving the failing deployment.**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Production smoke check failed::No earlier production deployment to roll back to."
            exit 1
          fi
          if vercel rollback "$PREVIOUS_DEPLOYMENT" --yes --scope "$VERCEL_ORG_ID"; then
            echo "Rolled back to the previous production deployment $PREVIOUS_DEPLOYMENT." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Production smoke check failed::Rolled back to the previous production deployment $PREVIOUS_DEPLOYMENT."
          else
            echo "**Rollback to $PREVIOUS_DEPLOYMENT failed. Production is serving the failing deployment.**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Rollback failed::Production is serving the failing deployment $DEPLOYMENT_URL."
            exit 1
          fi
      # One real search (one Cohere call a deploy), alert only: a vendor outage, rate limit or an unclear answer is
      # not fixed by rolling back, so it never triggers the rollback above. On unless SMOKE_SEARCH is "off".
      - name: Search smoke (alert only)
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' && vars.SMOKE_SEARCH != 'off' }}
        continue-on-error: true
        run: npm run test:smoke -- --grep "search answers a question in English"
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL }}
          EXPECTED_VERSION: ${{ github.sha }}
          SMOKE_SEARCH: "on"
