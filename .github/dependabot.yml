version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Playwright version is also the tag of the pinned browser image in scripts/*-docker.sh (test/resident-image.test.ts keeps
      # them equal) and the screenshot baselines belong to its Chromium: it is bumped by hand, with the image tag and baselines.
      - dependency-name: "@playwright/test"
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
