<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R-17 Add an entry — entry point</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/cvrh/components/bundle.css">
<link rel="stylesheet" href="cvh/cvh.css">
<script src="cvh/lib.js"></script>
<script src="cvh/data.js"></script>
<script src="cvh/inventory.js"></script>
<script src="cvh/icons.js"></script>
<script src="cvh/strings.en.js"></script>
<script src="cvh/strings.ur.js"></script>
<script src="cvh/strings.ps.js"></script>
<script src="cvh/strings.tl.js"></script>
<script src="cvh/strings.prs.js"></script>
<script src="cvh/strings.gu.js"></script>
<script src="cvh/strings.ta.js"></script>
<script src="cvh/strings.el.js"></script>
<script src="cvh/strings.sk.js"></script>
<script src="cvh/strings.bn.js"></script>
<script src="cvh/strings.hi.js"></script>
<script src="cvh/strings.pa.js"></script>
<script src="cvh/strings.zh.js"></script>
<script src="cvh/strings.es.js"></script>
<script src="cvh/strings.fr.js"></script>
<script src="cvh/strings.en.screens.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&amp;family=Noto+Sans:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400;700&amp;family=Noto+Sans+Devanagari:wght@400;700&amp;family=Noto+Sans+Gujarati:wght@400;700&amp;family=Noto+Sans+Bengali:wght@400;700&amp;family=Noto+Sans+Tamil:wght@400;700&amp;family=Noto+Sans+Gurmukhi:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#fafafa}</style>
</helmet>
<div class="cvh cvh-app {{rootClass}}" lang="{{bcp}}" dir="{{dir}}" style="width:{{w}}px;height:{{h}}px">
  <dc-import name="C_ProtoBar" screen-id="R-17" lang="{{lang}}" on-controls="{{app.openControls}}" embedded="{{true}}" hint-size="100%,28px"></dc-import>
  <sc-if value="{{showExercise}}"><dc-import name="X10_Exercise" lang="{{lang}}" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
  <sc-if value="{{exEnded}}"><dc-import name="X10_Exercise" state="ended" lang="{{lang}}" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
  <sc-if value="{{showHeader}}"><dc-import name="C_ResidentHeader" variant="{{headerVariant}}" lang="{{lang}}" basic="{{basic}}" basic-state="{{app.basicState}}" on-lang="{{app.openLang}}" on-choices="{{app.openChoices}}" on-basic="{{app.toggleBasic}}" embedded="{{true}}" hint-size="100%,116px"></dc-import></sc-if>
  <main class="cvh-main " aria-label="Add an entry — entry point">

<div class="cvh-screen">
  <button type="button" class="cvh-back" onClick="{{goBack}}"><span class="cvh-ico cvh-ico--back cvh-ico--sm" aria-hidden="true"></span>{{s.shell.back}}</button>
  <h1 class="cvh-h1">{{s.R17.title}}</h1>

  <sc-if value="{{entry}}">
    <div class="cvh-card cvh-stack" style="--gap:6px">
      <p class="cvh-caption cvh-muted">{{s.R17.lookingAt}}</p>
      <p class="cvh-kindline"><span class="cvh-pinmini cvh-pin--{{entry.shape}}"><span class="cvh-pin__mark"><span class="cvh-ico cvh-ico--{{entry.icon}}" aria-hidden="true"></span></span></span><span class="cvh-h3">{{entry.name}}</span></p>
      <p class="cvh-caption">{{entry.kind}}</p>
    </div>
    <button type="button" class="cvh-dest" onClick="{{entry.correct}}">
      <span class="cvh-ico cvh-ico--pencil" aria-hidden="true"></span>
      <span class="cvh-grow cvh-stack" style="--gap:2px"><span>{{s.R17.fromEntry}}</span><span class="cvh-caption" style="font-weight:400">{{s.R17.fromEntryLine}}</span></span>
      <span class="cvh-ico cvh-ico--chevron" aria-hidden="true"></span>
    </button>
    <button type="button" class="cvh-link" onClick="{{toAdd}}"><span class="cvh-ico cvh-ico--plus cvh-ico--sm" aria-hidden="true"></span>{{s.R17.addDifferent}}</button>
  </sc-if>

  <sc-if value="{{general}}">
    <button type="button" class="cvh-dest" onClick="{{toAdd}}">
      <span class="cvh-ico cvh-ico--plus" aria-hidden="true"></span>
      <span class="cvh-grow cvh-stack" style="--gap:2px"><span>{{s.R17.add}}</span><span class="cvh-caption cvh-hide-basic" style="font-weight:400">{{s.R17.addLine}}</span></span>
      <span class="cvh-ico cvh-ico--chevron" aria-hidden="true"></span>
    </button>
    <button type="button" class="cvh-dest" onClick="{{togglePick}}" aria-expanded="{{pickAria}}">
      <span class="cvh-ico cvh-ico--pencil" aria-hidden="true"></span>
      <span class="cvh-grow cvh-stack" style="--gap:2px"><span>{{s.R17.correct}}</span><span class="cvh-caption cvh-hide-basic" style="font-weight:400">{{s.R17.correctLine}}</span></span>
      <span class="cvh-ico cvh-ico--chevronDown {{pickFlip}}" aria-hidden="true"></span>
    </button>
    <sc-if value="{{pick}}">
      <section class="cvh-section" aria-labelledby="r17-pick">
        <h2 class="cvh-h3" id="r17-pick">{{s.R17.pickTitle}}</h2>
        <p class="cvh-caption cvh-hide-basic">{{s.R17.pickHint}}</p>
        <ul class="cvh-list">
          <sc-for list="{{near}}" as="n" hint-placeholder-count="3">
            <li><button type="button" class="cvh-dest" style="min-height:var(--tap)" onClick="{{n.go}}">
              <span class="cvh-pinmini cvh-pin--{{n.shape}}"><span class="cvh-pin__mark"><span class="cvh-ico cvh-ico--{{n.icon}}" aria-hidden="true"></span></span></span>
              <span class="cvh-grow cvh-stack" style="--gap:0"><span>{{n.name}}</span><span class="cvh-caption" style="font-weight:400">{{n.line}}</span></span>
              <span class="cvh-ico cvh-ico--chevron" aria-hidden="true"></span>
            </button></li>
          </sc-for>
        </ul>
      </section>
    </sc-if>
  </sc-if>
  <dc-import name="X03_Rules" variant="link" on-open="{{toRules}}" lang="{{lang}}" basic="{{basic}}" embedded="{{true}}" hint-size="100%,48px"></dc-import>
</div>

  </main>
  <sc-if value="{{showNav}}"><dc-import name="C_ResidentNav" active="{{navActive}}" lang="{{lang}}" basic="{{basic}}" on-nav="{{app.go}}" embedded="{{true}}" hint-size="100%,64px"></dc-import></sc-if>
  <sc-if value="{{toast}}"><div class="cvh-toast" role="status" lang="en" dir="ltr"><span class="cvh-ico cvh-ico--info cvh-ico--sm" aria-hidden="true"></span><span class="cvh-grow">{{toast}}</span></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"demo":{"editor": "enum", "options": ["From the map", "From the list, choosing a place to correct", "From an entry that looks wrong", "Basic mode: from the list"], "default": "From the map"},"embedded":{"editor":null},"fullh":{"editor":null},"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { toast: null, loc: {}, locKey: null, srev: 0 }; }
  componentDidMount() { var self = this; if (!this.props.app && window.CVH.session) this._off = window.CVH.session.on(function (st) { self.setState({ srev: st.rev }); }); }
  componentWillUnmount() { if (this._tt) clearTimeout(this._tt); if (this._off) this._off(); }
  renderVals() {
    var self = this, p = this.props, C = window.CVH, D = C.data();
    var DEMOS = {"From the map": {"persona": "devon", "scenario": "C", "params": {"from": "map"}}, "From the list, choosing a place to correct": {"persona": "devon", "scenario": "C", "params": {"from": "list"}, "loc": {"pick": true}}, "From an entry that looks wrong": {"persona": "devon", "scenario": "C", "params": {"from": "entry", "id": "L02"}}, "Basic mode: from the list": {"persona": "george", "scenario": "C", "basic": true, "basicState": "persisted", "params": {"from": "list"}}}, keys = Object.keys(DEMOS);
    var demoKey = p.app ? null : (p.demo && DEMOS[p.demo] ? p.demo : keys[0]);
    var localToast = function (m) {
      if (self._tt) clearTimeout(self._tt);
      self.setState({ toast: typeof m === 'string' ? m : 'This artboard shows one screen. Open "Resident app" to click through.' });
      self._tt = setTimeout(function () { self.setState({ toast: null }); }, 2600);
    };
    var app = p.app || C.demoApp(DEMOS[demoKey] || {}, localToast);
    if (!p.app && p.fullh) app.h = p.fullh;
    var lang = app.lang || 'en', basic = !!app.basic, s = C.strings(lang);
    var locKey = p.app ? 'v' + (app.visit || 0) : 'd:' + demoKey;
    var locInit = (p.app ? (app.params || {}).loc : (DEMOS[demoKey] || {}).loc) || {};
    var patch = this.state.locKey === locKey ? this.state.loc : {};
    var loc = Object.assign({}, locInit, patch);
    var setLoc = function (x) { var cur = self.state.locKey === locKey ? self.state.loc : {}; self.setState({ locKey: locKey, loc: Object.assign({}, cur, x) }); };
    var b = { self: this, app: app, C: C, D: D, s: s, en: C.strings('en'), lang: lang, basic: basic, scn: app.scenario || D.defaultScenario,
      ch: app.choices || {}, params: app.params || {}, loc: loc, setLoc: setLoc, go: app.go, back: app.back, flags: app.flags || {},
      act: app.act || function (a) { return C.session.act(Object.assign({ exercise: !!app.exercise }, a)); }, session: C.session.model(),
      persona: app.persona || {}, standalone: !p.app,
      toast: function (m) { if (p.app) app.flash(m); else localToast(m); },
      ago: function (mins) { return C.ago(mins, lang); }, dur: function (mins) { return C.duration(mins, lang); },
      fill: C.fill };
    var chrome = 'full';
    var base = { app: app, lang: lang, basic: basic, s: s, bcp: C.bcp(lang), dir: C.dir(lang),
      rootClass: basic ? 'cvh-basic' : '', w: app.w || 360, h: app.h || 640, toast: this.state.toast,
      showHeader: chrome === 'full' || chrome === 'firstRun', headerVariant: chrome === 'firstRun' ? 'firstRun' : 'full',
      showNav: chrome === 'full', navActive: 'map', showExercise: 'R-17'[0] === 'A' && !!app.exercise,
      exEnded: 'R-17'[0] === 'A' && !app.exercise && !!(D.partner && D.partner.run && D.partner.run.state === 'ended' && D.partner.run.endedMinsAgo != null && D.partner.run.endedMinsAgo < 30 && (D.partner.run.enrolled || []).indexOf('AMB-' + String((app.persona || {}).name || '').toUpperCase()) >= 0) };
    return Object.assign(base, this.screenVals(b));
  }

  screenVals(b) {
    var C = b.C, D = b.D, s = b.s, prm = b.params, go = b.go, loc = b.loc;
    var from = prm.from || 'map';
    var shapeOf = function (a) { return a.kind === 'communityOffer' ? 'offer' : (a.informal ? 'informal' : 'formal'); };
    var entry = null;
    if (from === 'entry' && prm.id) {
      var l = C.listingFor(prm.id), a = l ? C.asset(l.assetId) : null;
      if (l) entry = { name: l.name, kind: (s.orgKinds || {})[l.kind] || l.kind, icon: l.kind, shape: a ? shapeOf(a) : 'formal',
        correct: function () { go('R-22', { id: l.id }); } };
    }
    var home = C.home(b.ch);
    var near = (D.assets || []).map(function (a) { return { a: a, d: C.km(home, { lat: a.lat, lng: a.lng }) }; })
      .sort(function (p, q) { return p.d - q.d; }).slice(0, 5).map(function (r) {
        var l = C.listingFor(r.a.id);
        return { name: r.a.name, icon: r.a.kind, shape: shapeOf(r.a), line: ((s.orgKinds || {})[r.a.kind] || '') + ' · ' + C.fill(s.R15.distanceHome, { d: r.d.toFixed(1) }),
          go: function () { go('R-22', { id: l.id }); } };
      });
    return { entry: entry, general: !entry, near: near, pick: !!loc.pick, pickAria: loc.pick ? 'true' : 'false', pickFlip: loc.pick ? 'cvh-flip' : '',
      togglePick: function () { b.setLoc({ pick: !loc.pick }); },
      toAdd: function () { go('R-18', { mode: 'add', from: from }); },
      toRules: function () { go('R-18', { mode: 'add', from: from }); },
      goBack: function () { if (b.app.canBack) b.back(); else go(from === 'list' ? 'R-15' : (from === 'entry' && prm.id ? 'R-12' : 'R-14'), from === 'entry' ? { id: prm.id } : undefined); } };
  }

}
</script>
</body>
</html>
