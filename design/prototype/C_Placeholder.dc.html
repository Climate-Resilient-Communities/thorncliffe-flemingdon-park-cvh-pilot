<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen placeholder body</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/cvrh/components/bundle.css">
<link rel="stylesheet" href="cvh/cvh.css">
<script src="cvh/lib.js"></script>
<script src="cvh/data.js"></script>
<script src="cvh/inventory.js"></script>
<script src="cvh/icons.js"></script>
<script src="cvh/strings.en.js"></script>
<script src="cvh/strings.ur.js"></script>
<script src="cvh/strings.ps.js"></script>
<script src="cvh/strings.tl.js"></script>
<script src="cvh/strings.prs.js"></script>
<script src="cvh/strings.gu.js"></script>
<script src="cvh/strings.ta.js"></script>
<script src="cvh/strings.el.js"></script>
<script src="cvh/strings.sk.js"></script>
<script src="cvh/strings.bn.js"></script>
<script src="cvh/strings.hi.js"></script>
<script src="cvh/strings.pa.js"></script>
<script src="cvh/strings.zh.js"></script>
<script src="cvh/strings.es.js"></script>
<script src="cvh/strings.fr.js"></script>
<script src="cvh/strings.en.screens.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&amp;family=Noto+Sans:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400;700&amp;family=Noto+Sans+Devanagari:wght@400;700&amp;family=Noto+Sans+Gujarati:wght@400;700&amp;family=Noto+Sans+Bengali:wght@400;700&amp;family=Noto+Sans+Tamil:wght@400;700&amp;family=Noto+Sans+Gurmukhi:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#fafafa}</style>
</helmet>
<div class="cvh {{opClass}}" lang="en" dir="ltr" style="{{rootStyle}}">
  <div class="cvh-ph">
    <span class="cvh-ph__badge"><span class="cvh-ico cvh-ico--prototype cvh-ico--sm" aria-hidden="true"></span>Placeholder · designed in phase {{phase}}</span>
    <div class="cvh-stack" style="--gap:4px">
      <p class="cvh-caption cvh-muted" style="font-family:ui-monospace,Menlo,monospace">{{sc.id}} · {{sc.priority}} · stories {{sc.stories}}</p>
      <h1 class="cvh-h2">{{sc.name}}</h1>
    </div>
    <div class="cvh-stack" style="--gap:6px">
      <p class="cvh-strong cvh-caption">States this screen must show</p>
      <ul class="cvh-ph__states">
        <sc-for list="{{states}}" as="st" hint-placeholder-count="5"><li>{{st.text}}</li></sc-for>
      </ul>
      <sc-if value="{{more}}"><p class="cvh-caption cvh-muted">{{more}}</p></sc-if>
    </div>
    <sc-if value="{{hasFlows}}">
      <div class="cvh-stack" style="--gap:8px">
        <p class="cvh-strong cvh-caption">Flows through this screen</p>
        <sc-for list="{{flows}}" as="f" hint-placeholder-count="2">
          <div class="cvh-ph__flow">
            <p class="cvh-caption"><span class="cvh-strong">{{f.id}}</span> {{f.name}}</p>
            <div class="cvh-ph__steps" aria-label="Steps">
              <sc-for list="{{f.steps}}" as="x"><span class="cvh-ph__step {{x.cls}}">{{x.id}}</span></sc-for>
            </div>
            <div class="cvh-row cvh-wrap" style="--gap:8px">
              <sc-if value="{{f.prev}}"><button type="button" class="cvh-btn cvh-btn--secondary" style="font-size:16px;min-height:44px;padding:6px 14px" onClick="{{f.goPrev}}"><span class="cvh-ico cvh-ico--back cvh-ico--sm" aria-hidden="true"></span>{{f.prevLabel}}</button></sc-if>
              <sc-if value="{{f.next}}"><button type="button" class="cvh-btn cvh-btn--primary" style="font-size:16px;min-height:44px;padding:6px 14px" onClick="{{f.goNext}}">{{f.nextLabel}}<span class="cvh-ico cvh-ico--arrow cvh-ico--sm" aria-hidden="true"></span></button></sc-if>
              <sc-if value="{{f.elsewhere}}"><span class="cvh-caption cvh-muted">{{f.elsewhere}}</span></sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{standalone}}"><p class="cvh-caption cvh-muted">Open the app artboard to click through the flows.</p></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screenId":{"editor":"text","default":"R-03"},"app":{"editor":null},"embedded":{"editor":null},"$preview":{"width":360,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props, C = window.CVH, inv = window.CVH_INVENTORY || { flows: [] };
    var sid = p.screenId || 'R-03', sc = C.screen(sid) || { id: sid, name: '', stories: '', priority: '', states: [] };
    var app = p.app, prefix = sid[0];
    var sameApp = function (id) {
      if (!app) return false;
      if (prefix === 'R' || prefix === 'A') return id[0] === 'R' || id[0] === 'A';
      return id[0] === 'O' || id[0] === 'P';
    };
    var appName = function (id) { return (id[0] === 'R' || id[0] === 'A') ? 'the resident app' : id[0] === 'X' ? 'a printed or shared artefact' : 'the Hub and partner space'; };
    var flows = [];
    (inv.flows || []).forEach(function (f) {
      var idx = f.steps.indexOf(sid);
      if (idx < 0) return;
      var next = f.steps[idx + 1], prev = f.steps[idx - 1];
      var nextOk = next && sameApp(next), prevOk = prev && sameApp(prev);
      flows.push({ id: f.id, name: f.name,
        steps: f.steps.map(function (x, i) { return { id: x, cls: i === idx ? 'is-here' : '' }; }),
        next: !!nextOk, nextLabel: nextOk ? 'Next: ' + next + ' ' + ((C.screen(next) || {}).name || '') : '',
        goNext: function () { app.go(next, { flow: f.id }); },
        prev: !!prevOk, prevLabel: prevOk ? prev : '', goPrev: function () { app.go(prev, { flow: f.id }); },
        elsewhere: next && !nextOk && app ? 'Next step ' + next + ' is in ' + appName(next) + '.' : '' });
    });
    var states = (sc.states || []).slice(0, 8).map(function (t) { return { text: t }; });
    var extra = (sc.states || []).length - states.length;
    var phase = prefix === 'R' ? 2 : (prefix === 'A' || prefix === 'O') ? 3 : 4;
    return { sc: sc, phase: phase, states: states, more: extra > 0 ? 'and ' + extra + ' more states' : '',
      flows: flows, hasFlows: flows.length > 0, standalone: !app,
      opClass: (prefix === 'O' || prefix === 'P') ? 'cvh-op' : '',
      rootStyle: p.embedded ? '' : 'width:360px;height:520px;padding:16px;background:#fafafa;overflow:auto;' };
  }
}
</script>
</body>
</html>
