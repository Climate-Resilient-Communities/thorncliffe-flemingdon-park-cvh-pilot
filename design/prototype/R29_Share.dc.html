<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R-29 Share an alert</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/cvrh/components/bundle.css">
<link rel="stylesheet" href="cvh/cvh.css">
<script src="cvh/lib.js"></script>
<script src="cvh/data.js"></script>
<script src="cvh/inventory.js"></script>
<script src="cvh/icons.js"></script>
<script src="cvh/strings.en.js"></script>
<script src="cvh/strings.ur.js"></script>
<script src="cvh/strings.ps.js"></script>
<script src="cvh/strings.tl.js"></script>
<script src="cvh/strings.prs.js"></script>
<script src="cvh/strings.gu.js"></script>
<script src="cvh/strings.ta.js"></script>
<script src="cvh/strings.el.js"></script>
<script src="cvh/strings.sk.js"></script>
<script src="cvh/strings.bn.js"></script>
<script src="cvh/strings.hi.js"></script>
<script src="cvh/strings.pa.js"></script>
<script src="cvh/strings.zh.js"></script>
<script src="cvh/strings.es.js"></script>
<script src="cvh/strings.fr.js"></script>
<script src="cvh/strings.en.screens.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&amp;family=Noto+Sans:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400;700&amp;family=Noto+Sans+Devanagari:wght@400;700&amp;family=Noto+Sans+Gujarati:wght@400;700&amp;family=Noto+Sans+Bengali:wght@400;700&amp;family=Noto+Sans+Tamil:wght@400;700&amp;family=Noto+Sans+Gurmukhi:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#fafafa}</style>
</helmet>
<div class="cvh cvh-app {{rootClass}}" lang="{{bcp}}" dir="{{dir}}" style="width:{{w}}px;height:{{h}}px">
  <dc-import name="C_ProtoBar" screen-id="R-29" lang="{{lang}}" on-controls="{{app.openControls}}" embedded="{{true}}" hint-size="100%,28px"></dc-import>
  <sc-if value="{{showExercise}}"><dc-import name="X10_Exercise" lang="{{lang}}" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
  <sc-if value="{{exEnded}}"><dc-import name="X10_Exercise" state="ended" lang="{{lang}}" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
  <sc-if value="{{showHeader}}"><dc-import name="C_ResidentHeader" variant="{{headerVariant}}" lang="{{lang}}" basic="{{basic}}" basic-state="{{app.basicState}}" on-lang="{{app.openLang}}" on-choices="{{app.openChoices}}" on-basic="{{app.toggleBasic}}" embedded="{{true}}" hint-size="100%,116px"></dc-import></sc-if>
  <main class="cvh-main " aria-label="Share an alert">

<div class="cvh-screen">
  <button type="button" class="cvh-back" onClick="{{goBack}}"><span class="cvh-ico cvh-ico--back cvh-ico--sm" aria-hidden="true"></span>{{s.shell.back}}</button>
  <div class="cvh-stack" style="--gap:4px">
    <h1 class="cvh-h1">{{s.R29.title}}</h1>
    <p class="cvh-hide-basic">{{s.R29.lead}}</p>
  </div>

  <section class="cvh-stack" style="--gap:8px" aria-labelledby="r29-prev">
    <p class="cvh-eyebrow" id="r29-prev">{{s.R29.preview}}</p>
    <div class="cvh-sharebox">
      <p class="cvh-strong" style="font-size:var(--fs-alert);color:var(--ink)">{{m.head}}</p>
      <sc-if value="{{m.nyk}}"><p>{{m.nyk}}</p></sc-if>
      <dc-import name="X02_Origin" dc-props="{{origin}}" surface="forwarded" lang="{{lang}}" basic="{{basic}}" embedded="{{true}}" hint-size="100%,56px"></dc-import>
      <p>{{m.where}}</p>
      <p class="cvh-strong">{{m.action}}</p>
      <p class="cvh-caption">{{m.time}}</p>
      <p class="cvh-caption">{{m.not911}}</p>
      <p class="cvh-caption" style="overflow-wrap:anywhere">{{m.link}}</p>
    </div>
  </section>

  <p class="cvh-row cvh-strong" style="--gap:10px;align-items:flex-start;color:var(--ink)"><span class="cvh-ico cvh-ico--check" aria-hidden="true"></span><span class="cvh-grow">{{s.R29.everyone}}</span></p>
  <p class="cvh-row" style="--gap:10px;align-items:flex-start"><span class="cvh-ico cvh-ico--lock" aria-hidden="true"></span><span class="cvh-grow">{{s.R29.notRecorded}}</span></p>

  <div class="cvh-stack" style="--gap:6px">
    <button type="button" class="cvh-btn cvh-btn--primary cvh-btn--block cvh-btn--lg" onClick="{{send}}"><span class="cvh-ico cvh-ico--share" aria-hidden="true"></span>{{s.R29.send}}</button>
    <p class="cvh-caption cvh-hide-basic" style="text-align:center">{{s.R29.sendLine}}</p>
  </div>
</div>

  </main>
  <sc-if value="{{showNav}}"><dc-import name="C_ResidentNav" active="{{navActive}}" lang="{{lang}}" basic="{{basic}}" on-nav="{{app.go}}" embedded="{{true}}" hint-size="100%,64px"></dc-import></sc-if>
  <sc-if value="{{toast}}"><div class="cvh-toast" role="status" lang="en" dir="ltr"><span class="cvh-ico cvh-ico--info cvh-ico--sm" aria-hidden="true"></span><span class="cvh-grow">{{toast}}</span></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"demo":{"editor": "enum", "options": ["Verified alert (power outage, Yusuf)", "Ambassador post, not yet verified (Rashid)", "Heat alert shared by Nasrin: nothing tailored goes out", "Basic mode (Amina)"], "default": "Verified alert (power outage, Yusuf)"},"embedded":{"editor":null},"fullh":{"editor":null},"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { toast: null, loc: {}, locKey: null, srev: 0 }; }
  componentDidMount() { var self = this; if (!this.props.app && window.CVH.session) this._off = window.CVH.session.on(function (st) { self.setState({ srev: st.rev }); }); }
  componentWillUnmount() { if (this._tt) clearTimeout(this._tt); if (this._off) this._off(); }
  renderVals() {
    var self = this, p = this.props, C = window.CVH, D = C.data();
    var DEMOS = {"Verified alert (power outage, Yusuf)": {"persona": "yusuf", "scenario": "A", "params": {"alert": "AL-05"}}, "Ambassador post, not yet verified (Rashid)": {"persona": "rashid", "scenario": "A", "params": {"alert": "AL-07", "unverified": true}}, "Heat alert shared by Nasrin: nothing tailored goes out": {"persona": "nasrin", "scenario": "B", "params": {"alert": "AL-06"}}, "Basic mode (Amina)": {"persona": "amina", "scenario": "A", "basic": true, "basicState": "persisted", "params": {"alert": "AL-05"}}}, keys = Object.keys(DEMOS);
    var demoKey = p.app ? null : (p.demo && DEMOS[p.demo] ? p.demo : keys[0]);
    var localToast = function (m) {
      if (self._tt) clearTimeout(self._tt);
      self.setState({ toast: typeof m === 'string' ? m : 'This artboard shows one screen. Open "Resident app" to click through.' });
      self._tt = setTimeout(function () { self.setState({ toast: null }); }, 2600);
    };
    var app = p.app || C.demoApp(DEMOS[demoKey] || {}, localToast);
    if (!p.app && p.fullh) app.h = p.fullh;
    var lang = app.lang || 'en', basic = !!app.basic, s = C.strings(lang);
    var locKey = p.app ? 'v' + (app.visit || 0) : 'd:' + demoKey;
    var locInit = (p.app ? (app.params || {}).loc : (DEMOS[demoKey] || {}).loc) || {};
    var patch = this.state.locKey === locKey ? this.state.loc : {};
    var loc = Object.assign({}, locInit, patch);
    var setLoc = function (x) { var cur = self.state.locKey === locKey ? self.state.loc : {}; self.setState({ locKey: locKey, loc: Object.assign({}, cur, x) }); };
    var b = { self: this, app: app, C: C, D: D, s: s, en: C.strings('en'), lang: lang, basic: basic, scn: app.scenario || D.defaultScenario,
      ch: app.choices || {}, params: app.params || {}, loc: loc, setLoc: setLoc, go: app.go, back: app.back, flags: app.flags || {},
      act: app.act || function (a) { return C.session.act(Object.assign({ exercise: !!app.exercise }, a)); }, session: C.session.model(),
      persona: app.persona || {}, standalone: !p.app,
      toast: function (m) { if (p.app) app.flash(m); else localToast(m); },
      ago: function (mins) { return C.ago(mins, lang); }, dur: function (mins) { return C.duration(mins, lang); },
      fill: C.fill };
    var chrome = 'full';
    var base = { app: app, lang: lang, basic: basic, s: s, bcp: C.bcp(lang), dir: C.dir(lang),
      rootClass: basic ? 'cvh-basic' : '', w: app.w || 360, h: app.h || 640, toast: this.state.toast,
      showHeader: chrome === 'full' || chrome === 'firstRun', headerVariant: chrome === 'firstRun' ? 'firstRun' : 'full',
      showNav: chrome === 'full', navActive: 'now', showExercise: 'R-29'[0] === 'A' && !!app.exercise,
      exEnded: 'R-29'[0] === 'A' && !app.exercise && !!(D.partner && D.partner.run && D.partner.run.state === 'ended' && D.partner.run.endedMinsAgo != null && D.partner.run.endedMinsAgo < 30 && (D.partner.run.enrolled || []).indexOf('AMB-' + String((app.persona || {}).name || '').toUpperCase()) >= 0) };
    return Object.assign(base, this.screenVals(b));
  }

  screenVals(b) {
    var C = b.C, s = b.s, x = s.R29, prm = b.params, go = b.go;
    var id = prm.alert || 'AL-05';
    var ref = Object.assign({}, C.refFor(id, b.scn)); if (prm.upto) ref.upto = prm.upto;
    var sn = C.snap(ref, b.scn);
    if (!sn) return { m: {}, origin: {}, goBack: b.back, send: b.back };
    // The standard version only: nothing tailored to the sender is ever added here.
    var o = C.originProps(sn, { unverified: !!prm.unverified });
    var m = this.message(b, sn);
    return { m: m, origin: o,
      goBack: function () { if (b.app.canBack) b.back(); else go('R-07', { alert: id, unverified: !!prm.unverified }); },
      send: function () {
        b.toast(x.handed);
        go('R-30', { alert: id, sharedBy: b.app.personaId, unverified: !!prm.unverified });
      } };
  }
  // The forwarded message, composed from the alert in the fixed alert order: what, not known yet, origin (X-02),
  // where, one action, times as clock times (the message is read later), not-911, link.
  message(b, sn) {
    var C = b.C, s = b.s, x = s.R29, a = sn.a;
    var clock = C.clock(b.scn), now = (function (t) { var p = t.split(':'); return (+p[0]) * 60 + (+p[1]); })(clock.time);
    var days = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    var at = function (minsAgo) {
      var t = now - minsAgo, d = 0;
      while (t < 0) { t += 1440; d++; }
      var hh = Math.floor(t / 60), mm = t % 60, time = C.hhmm12((hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm);
      if (!d) return C.fill(x.todayAt, { time: time });
      var day = days[(days.indexOf(clock.day) - d + 70) % 7];
      return C.fill(x.dayAt, { day: s.time.days7[day], time: time });
    };
    var types = (a.types || []).map(function (t) { return s.x13[t] || t; }).join(', ');
    var time = C.fill(x.postedAt, { t: at(sn.postedMins) });
    if (sn.entries.length > 1) time += '. ' + C.fill(x.updatedAt, { t: at(sn.updatedMins) });
    return { head: types + ': ' + a.headline, nyk: sn.notYetKnown ? s.R07.notYetKnownLabel + ': ' + sn.notYetKnown.charAt(0).toLowerCase() + sn.notYetKnown.slice(1) + '.' : '', where: sn.where + '.', action: a.action,
      time: time + '.', not911: s.x01.short, url: 'cvh.example/a/' + a.id.replace('AL-', ''),
      link: C.fill(x.linkLine, { url: 'cvh.example/a/' + a.id.replace('AL-', '') }) };
  }

}
</script>
</body>
</html>
