<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R-15 Asset map — list view</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/cvrh/components/bundle.css">
<link rel="stylesheet" href="cvh/cvh.css">
<script src="cvh/lib.js"></script>
<script src="cvh/data.js"></script>
<script src="cvh/inventory.js"></script>
<script src="cvh/icons.js"></script>
<script src="cvh/strings.en.js"></script>
<script src="cvh/strings.ur.js"></script>
<script src="cvh/strings.ps.js"></script>
<script src="cvh/strings.tl.js"></script>
<script src="cvh/strings.prs.js"></script>
<script src="cvh/strings.gu.js"></script>
<script src="cvh/strings.ta.js"></script>
<script src="cvh/strings.el.js"></script>
<script src="cvh/strings.sk.js"></script>
<script src="cvh/strings.bn.js"></script>
<script src="cvh/strings.hi.js"></script>
<script src="cvh/strings.pa.js"></script>
<script src="cvh/strings.zh.js"></script>
<script src="cvh/strings.es.js"></script>
<script src="cvh/strings.fr.js"></script>
<script src="cvh/strings.en.screens.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&amp;family=Noto+Sans:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400;700&amp;family=Noto+Sans+Devanagari:wght@400;700&amp;family=Noto+Sans+Gujarati:wght@400;700&amp;family=Noto+Sans+Bengali:wght@400;700&amp;family=Noto+Sans+Tamil:wght@400;700&amp;family=Noto+Sans+Gurmukhi:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#fafafa}</style>
</helmet>
<div class="cvh cvh-app {{rootClass}}" lang="{{bcp}}" dir="{{dir}}" style="width:{{w}}px;height:{{h}}px">
  <dc-import name="C_ProtoBar" screen-id="R-15" lang="{{lang}}" on-controls="{{app.openControls}}" embedded="{{true}}" hint-size="100%,28px"></dc-import>
  <sc-if value="{{showExercise}}"><dc-import name="X10_Exercise" lang="{{lang}}" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
  <sc-if value="{{exEnded}}"><dc-import name="X10_Exercise" state="ended" lang="{{lang}}" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
  <sc-if value="{{showHeader}}"><dc-import name="C_ResidentHeader" variant="{{headerVariant}}" lang="{{lang}}" basic="{{basic}}" basic-state="{{app.basicState}}" on-lang="{{app.openLang}}" on-choices="{{app.openChoices}}" on-basic="{{app.toggleBasic}}" embedded="{{true}}" hint-size="100%,116px"></dc-import></sc-if>
  <main class="cvh-main " aria-label="Asset map — list view">

<sc-if value="{{hasApplied}}">
  <dc-import name="X11_FilterBar" filters="{{applied}}" hiding="{{hidden}}" on-remove="{{removeFilter}}" lang="{{lang}}" basic="{{basic}}" embedded="{{true}}" hint-size="100%,130px"></dc-import>
</sc-if>
<div class="cvh-screen">
  <sc-if value="{{showBack}}">
    <button type="button" class="cvh-back" onClick="{{goBack}}"><span class="cvh-ico cvh-ico--back cvh-ico--sm" aria-hidden="true"></span>{{s.shell.back}}</button>
  </sc-if>
  <div class="cvh-row" style="--gap:8px">
    <div class="cvh-segment cvh-grow cvh-hide-basic" role="group" aria-label="{{s.R14.title}}">
      <button type="button" aria-pressed="false" onClick="{{toMap}}"><span class="cvh-ico cvh-ico--map cvh-ico--sm" aria-hidden="true"></span>{{s.R14.mapView}}</button>
      <button type="button" class="is-on" aria-pressed="true"><span class="cvh-ico cvh-ico--list cvh-ico--sm" aria-hidden="true"></span>{{s.R14.list}}</button>
    </div>
    <button type="button" class="cvh-btn cvh-btn--secondary" onClick="{{toAdd}}"><span class="cvh-ico cvh-ico--plus cvh-ico--sm" aria-hidden="true"></span>{{s.R15.add}}</button>
  </div>
  <h1 class="cvh-h1">{{s.R15.title}}</h1>
  <sc-if value="{{hazardLine}}">
    <div class="cvh-mapband" role="status" style="border-radius:12px;border:1px solid var(--help-box-edge)">
      <span class="cvh-ico cvh-ico--{{hazardIcon}}" aria-hidden="true"></span>
      <span class="cvh-grow cvh-stack" style="--gap:0"><span class="cvh-strong">{{hazardLine}}</span><button type="button" class="cvh-link" onClick="{{clearHazard}}">{{s.R14.allPlaces}}</button></span>
    </div>
  </sc-if>
  <div class="cvh-stack" style="--gap:6px">
    <p class="cvh-strong">{{s.R14.filters}}</p>
    <div class="cvh-hscroll" role="group" aria-label="{{s.R14.filters}}">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button type="button" class="cvh-chip cvh-fchip {{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.toggle}}"><span class="cvh-ico cvh-ico--{{c.icon}} cvh-ico--sm" aria-hidden="true"></span><span>{{c.label}}</span><sc-if value="{{c.on}}"><span class="cvh-ico cvh-ico--check cvh-ico--sm" aria-hidden="true"></span></sc-if></button>
      </sc-for>
    </div>
    <select class="cvh-select" aria-label="{{s.R14.subLabel}}" value="{{subVal}}" onChange="{{pickSub}}">
      <sc-for list="{{subOpts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.label}}</option></sc-for>
    </select>
  </div>

  <sc-if value="{{hasResults}}">
    <p class="cvh-caption cvh-muted"><span class="cvh-strong" style="color:var(--ink)">{{countLine}}</span> · {{s.R15.byDistance}}</p>
    <ul class="cvh-list">
      <sc-for list="{{entries}}" as="e" hint-placeholder-count="3">
        <li class="cvh-result">
          <button type="button" class="cvh-result__name" onClick="{{e.open}}"><span class="cvh-grow">{{e.name}}</span><span class="cvh-ico cvh-ico--chevron cvh-ico--sm" aria-hidden="true"></span></button>
          <p class="cvh-kindline"><span class="cvh-pinmini cvh-pin--{{e.shape}} {{e.spaceCls}}"><span class="cvh-pin__mark"><span class="cvh-ico cvh-ico--{{e.icon}}" aria-hidden="true"></span></span></span><span class="cvh-strong">{{e.kind}}</span><span class="cvh-muted">· {{e.dist}}</span></p>
          <p class="cvh-row" style="--gap:6px;align-items:flex-start"><span class="cvh-ico cvh-ico--clock cvh-ico--sm" aria-hidden="true" style="margin-top:3px"></span><span>{{e.hours}}</span></p>
          <sc-if value="{{e.space}}">
            <dc-import name="X09_SpaceStatus" space="{{e.space}}" lang="{{lang}}" basic="{{basic}}" embedded="{{true}}" hint-size="100%,64px"></dc-import>
            <div class="cvh-result__facts"><sc-for list="{{e.spaceFacts}}" as="f" hint-placeholder-count="2"><span class="cvh-fact"><span class="cvh-ico cvh-ico--{{f.icon}} cvh-ico--sm" aria-hidden="true"></span>{{f.label}}</span></sc-for></div>
          </sc-if>
          <sc-if value="{{e.help}}"><dc-import name="X14_HowTheyHelp" hazard="{{e.hazard}}" text="{{e.help}}" lang="{{lang}}" basic="{{basic}}" embedded="{{true}}" hint-size="100%,80px"></dc-import></sc-if>
          <sc-if value="{{e.hasFacts}}">
            <div class="cvh-result__facts cvh-hide-basic"><sc-for list="{{e.facts}}" as="f" hint-placeholder-count="2"><span class="cvh-fact"><span class="cvh-ico cvh-ico--{{f.icon}} cvh-ico--sm" aria-hidden="true"></span>{{f.label}}</span></sc-for></div>
          </sc-if>
          <sc-if value="{{e.contributed}}"><span class="cvh-tag" style="align-self:flex-start"><span class="cvh-ico cvh-ico--communityOffer cvh-ico--sm" aria-hidden="true"></span>{{s.R16.contributed}}</span></sc-if>
        </li>
      </sc-for>
    </ul>
    <sc-if value="{{moreLabel}}"><button type="button" class="cvh-btn cvh-btn--secondary cvh-btn--block" onClick="{{showMore}}">{{moreLabel}}</button></sc-if>
  </sc-if>
  <sc-if value="{{empty}}">
    <div class="cvh-card cvh-stack" style="--gap:10px" role="status">
      <p class="cvh-h3">{{s.R15.empty}}</p>
      <sc-if value="{{suggest}}">
        <p>{{suggest.line}}</p>
        <button type="button" class="cvh-btn cvh-btn--primary" style="align-self:flex-start" onClick="{{suggest.apply}}">{{suggest.button}}</button>
      </sc-if>
      <sc-if value="{{noSuggest}}"><p>{{s.R15.emptyBody}}</p></sc-if>
      <button type="button" class="cvh-btn cvh-btn--secondary" style="align-self:flex-start" onClick="{{clearAll}}">{{s.R15.clearAll}}</button>
    </div>
  </sc-if>

  <div class="cvh-stack" style="--gap:4px;padding-top:8px;border-top:1px solid var(--border)">
    <dc-import name="X03_Rules" variant="link" on-open="{{openRules}}" lang="{{lang}}" basic="{{basic}}" embedded="{{true}}" hint-size="100%,48px"></dc-import>
    <button type="button" class="cvh-link" onClick="{{toMissing}}"><span class="cvh-ico cvh-ico--pencil cvh-ico--sm" aria-hidden="true"></span>{{s.R15.missing}}</button>
  </div>
</div>

<sc-if value="{{rules}}">
  <div class="cvh-overlay" role="dialog" aria-modal="true" aria-label="{{s.x03.title}}">
    <div class="cvh-sheet">
      <div class="cvh-sheet__head">
        <span class="cvh-grow"></span>
        <button type="button" class="cvh-iconbtn" onClick="{{closeSheet}}" aria-label="{{s.shell.close}}"><span class="cvh-ico cvh-ico--close" aria-hidden="true"></span></button>
      </div>
      <div class="cvh-sheet__body">
        <dc-import name="X03_Rules" variant="full" lang="{{lang}}" basic="{{basic}}" embedded="{{true}}" hint-size="100%,420px"></dc-import>
        <button type="button" class="cvh-btn cvh-btn--secondary cvh-btn--block" onClick="{{toAdd}}"><span class="cvh-ico cvh-ico--plus cvh-ico--sm" aria-hidden="true"></span>{{s.R14.add}}</button>
        <button type="button" class="cvh-btn cvh-btn--quiet cvh-btn--block" onClick="{{closeSheet}}">{{s.shell.close}}</button>
      </div>
    </div>
  </div>
</sc-if>

  </main>
  <sc-if value="{{showNav}}"><dc-import name="C_ResidentNav" active="{{navActive}}" lang="{{lang}}" basic="{{basic}}" on-nav="{{app.go}}" embedded="{{true}}" hint-size="100%,64px"></dc-import></sc-if>
  <sc-if value="{{toast}}"><div class="cvh-toast" role="status" lang="en" dir="ltr"><span class="cvh-ico cvh-ico--info cvh-ico--sm" aria-hidden="true"></span><span class="cvh-grow">{{toast}}</span></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"demo":{"editor": "enum", "options": ["Ordered by distance (Devon)", "From the heat alert: Nasrin, her filters named", "Open-as-a-space filter with X-09 on each entry (George)", "Utility filters: charging and washrooms", "Preparedness-kit filter", "Disruption view: power outage, each says how", "Empty: no places match", "Basic mode: open spaces (George)", "Basic mode: everything nearest first", "The rules of this space, from the list"], "default": "Ordered by distance (Devon)"},"embedded":{"editor":null},"fullh":{"editor":null},"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { toast: null, loc: {}, locKey: null, srev: 0 }; }
  componentDidMount() { var self = this; if (!this.props.app && window.CVH.session) this._off = window.CVH.session.on(function (st) { self.setState({ srev: st.rev }); }); }
  componentWillUnmount() { if (this._tt) clearTimeout(this._tt); if (this._off) this._off(); }

    var demoKey = p.app ? null : (p.demo && DEMOS[p.demo] ? p.demo : keys[0]);

    var setLoc = function (x) { var cur = self.state.locKey === locKey ? self.state.loc : {}; self.setState({ locKey: locKey, loc: Object.assign({}, cur, x) }); };
    var b = { self: this, app: app, C: C, D: D, s: s, en: C.strings('en'), lang: lang, basic: basic, scn: app.scenario || D.defaultScenario,
      ch: app.choices || {}, params: app.params || {}, loc: loc, setLoc: setLoc, go: app.go, back: app.back, flags: app.flags || {},

      showHeader: chrome === 'full' || chrome === 'firstRun', headerVariant: chrome === 'firstRun' ? 'firstRun' : 'full',
      showNav: chrome === 'full', navActive: 'map', showExercise: 'R-15'[0] === 'A' && !!app.exercise,
      exEnded: 'R-15'[0] === 'A' && !app.exercise && !!(D.partner && D.partner.run && D.partner.run.state === 'ended' && D.partner.run.endedMinsAgo != null && D.partner.run.endedMinsAgo < 30 && (D.partner.run.enrolled || []).indexOf('AMB-' + String((app.persona || {}).name || '').toUpperCase()) >= 0) };
    return Object.assign(base, this.screenVals(b));
  }

  screenVals(b) {
    var self = this, C = b.C, s = b.s, x = s.R15, loc = b.loc, go = b.go, prm = b.params;
    var SID = 'R-15';
    var F = this.readF(b), P = this.places(b, F);

        facts: facts, hasFacts: facts.length > 0 && !F.hazard, contributed: a.source === 'contribution',

    var suggest = null;

      ui.applied.forEach(function (ap) {
        var G = JSON.parse(JSON.stringify(F));
        if (ap.id === 'space') G.spaces = false; else if (ap.id === 'kit') G.kit = false; else if (ap.id === 'sub') G.subcat = '';
        else if (ap.id.indexOf('u:') === 0) G.utility = G.utility.filter(function (v) { return v !== ap.id.slice(2); });

        var got = self.places(b, G).shown;
        if (got.length && (!best || got.length > best.n.length)) best = { ap: ap, n: got };
      });
      if (best) {

        suggest = { line: C.fill(best.n.length === 1 ? x.suggestOne : x.suggest, { f: best.ap.label, n: best.n.length, d: C.fill(x.distanceHome, { d: near.toFixed(1) }) }),
          button: C.fill(x.suggestButton, { f: best.ap.label }), apply: function () { ui.removeFilter(best.ap.id); } };

      showBack: prm.from === 'alert' || prm.from === 'guide', goBack: function () { if (b.app.canBack) b.back(); else go(prm.alert ? 'R-07' : 'R-03', prm.alert ? { alert: prm.alert } : undefined); },
      toMap: function () { if (b.app.replace && !b.standalone) b.app.replace('R-14', mapParams); else go('R-14', mapParams); },
      toAdd: function () { go('R-18', { mode: 'add', from: 'list' }); },
      toMissing: function () { go('R-17', { from: 'list' }); },
      hasResults: rows.length > 0, empty: rows.length === 0, suggest: suggest, noSuggest: !suggest,
      countLine: rows.length === 1 ? x.countOne : C.fill(x.count, { n: rows.length }), entries: entries,

  /* ---- Shared by R-14, R-15 and R-16 (the same filter model in both views) ---- */

  readF(b) {

    var keep = V ? { lat: V.lat, lng: V.lng, z: V.z } : { shown: b.loc.shown };

  places(b, F) {

  }
  passes(b, r, F) {

    if (F.kit && !a.kit) return false;

    for (var j = 0; j < F.filters.length; j++) {

      // A space's own record answers step-free and ID when the listing does not

      else if (f.id === 'stepFree') { if (!(l.stepFree === 'yes' || (sp && sp.stepFree === true))) return false; }
