<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R-06 Sign-up confirmation, how to stop, how to change</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/cvrh/components/bundle.css">
<link rel="stylesheet" href="cvh/cvh.css">
<script src="cvh/lib.js"></script>
<script src="cvh/data.js"></script>
<script src="cvh/inventory.js"></script>
<script src="cvh/icons.js"></script>
<script src="cvh/strings.en.js"></script>
<script src="cvh/strings.ur.js"></script>
<script src="cvh/strings.ps.js"></script>
<script src="cvh/strings.tl.js"></script>
<script src="cvh/strings.prs.js"></script>
<script src="cvh/strings.gu.js"></script>
<script src="cvh/strings.ta.js"></script>
<script src="cvh/strings.el.js"></script>
<script src="cvh/strings.sk.js"></script>
<script src="cvh/strings.bn.js"></script>
<script src="cvh/strings.hi.js"></script>
<script src="cvh/strings.pa.js"></script>
<script src="cvh/strings.zh.js"></script>
<script src="cvh/strings.es.js"></script>
<script src="cvh/strings.fr.js"></script>
<script src="cvh/strings.en.screens.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&amp;family=Noto+Sans:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400;700&amp;family=Noto+Sans+Devanagari:wght@400;700&amp;family=Noto+Sans+Gujarati:wght@400;700&amp;family=Noto+Sans+Bengali:wght@400;700&amp;family=Noto+Sans+Tamil:wght@400;700&amp;family=Noto+Sans+Gurmukhi:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#fafafa}</style>
</helmet>
<div class="cvh cvh-app {{rootClass}}" lang="{{bcp}}" dir="{{dir}}" style="width:{{w}}px;height:{{h}}px">
  <dc-import name="C_ProtoBar" screen-id="R-06" lang="{{lang}}" on-controls="{{app.openControls}}" embedded="{{true}}" hint-size="100%,28px"></dc-import>
  <sc-if value="{{showExercise}}"><dc-import name="X10_Exercise" lang="{{lang}}" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
  <sc-if value="{{exEnded}}"><dc-import name="X10_Exercise" state="ended" lang="{{lang}}" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
  <sc-if value="{{showHeader}}"><dc-import name="C_ResidentHeader" variant="{{headerVariant}}" lang="{{lang}}" basic="{{basic}}" basic-state="{{app.basicState}}" on-lang="{{app.openLang}}" on-choices="{{app.openChoices}}" on-basic="{{app.toggleBasic}}" embedded="{{true}}" hint-size="100%,116px"></dc-import></sc-if>
  <main class="cvh-main cvh-main--device" aria-label="Sign-up confirmation, how to stop, how to change">

<div class="cvh-devlabel cvh-devlabel--wrap" role="note">
  <span class="cvh-ico cvh-ico--prototype cvh-ico--sm" aria-hidden="true"></span>
  <span class="cvh-devlabel__text">{{s.R06.deviceLabel}}. {{s.R04.sampleLabel}}</span>
  <button type="button" class="cvh-devlabel__btn" onClick="{{toApp}}">{{s.R06.back}}</button>
</div>
<sc-if value="{{exNote}}"><div class="cvh-devlabel" role="note"><span class="cvh-ico cvh-ico--exercise cvh-ico--sm" aria-hidden="true"></span><span class="cvh-devlabel__text">{{exNote}}</span></div></sc-if>
<div class="cvh-device">
  <div class="cvh-device__screen">
    <div class="cvh-device__bar">
      <span class="cvh-ico cvh-ico--phone" aria-hidden="true"></span>
      <span class="cvh-stack" style="--gap:0"><span class="cvh-strong" style="font-size:18px">{{s.R04.from}}</span><span style="font-size:18px;color:var(--text-muted)">{{s.R04.fromNumber}}</span></span>
    </div>
    <div class="cvh-device__body cvh-device__body--end" role="log" aria-label="{{s.R04.from}}">
      <sc-for list="{{msgs}}" as="m" hint-placeholder-count="3">
        <div class="cvh-bubble cvh-bubble--lines {{m.cls}}">
          <sc-if value="{{m.ex}}"><span class="cvh-bubline"><dc-import name="X10_Exercise" variant="line" lang="{{lang}}" embedded="{{true}}" hint-size="100%,28px"></dc-import></span></sc-if>
          <sc-for list="{{m.lines}}" as="l" hint-placeholder-count="2"><span class="cvh-bubline">{{l}}</span></sc-for>
          <span class="cvh-bubble__time">{{m.time}}</span>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{hasReplies}}">
      <div class="cvh-device__replies" role="group" aria-label="{{s.R06.replyHint}}">
        <span class="cvh-caption cvh-muted" lang="en">{{s.R06.replyHint}}:</span>
        <sc-for list="{{replies}}" as="r" hint-placeholder-count="2">
          <button type="button" class="cvh-chip" onClick="{{r.send}}">{{r.label}}</button>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>

  </main>
  <sc-if value="{{showNav}}"><dc-import name="C_ResidentNav" active="{{navActive}}" lang="{{lang}}" basic="{{basic}}" on-nav="{{app.go}}" embedded="{{true}}" hint-size="100%,64px"></dc-import></sc-if>
  <sc-if value="{{toast}}"><div class="cvh-toast" role="status" lang="en" dir="ltr"><span class="cvh-ico cvh-ico--info cvh-ico--sm" aria-hidden="true"></span><span class="cvh-grow">{{toast}}</span></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"demo":{"editor": "enum", "options": ["Confirmation requested", "Confirmed by reply YES", "Groups changed by keyword", "Check-in withdrawn by keyword", "Stopped", "Exercise: a drill sign-up on an enrolled ambassador phone"], "default": "Confirmation requested"},"embedded":{"editor":null},"fullh":{"editor":null},"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { toast: null, loc: {}, locKey: null, srev: 0 }; }
  componentDidMount() { var self = this; if (!this.props.app && window.CVH.session) this._off = window.CVH.session.on(function (st) { self.setState({ srev: st.rev }); }); }
  componentWillUnmount() { if (this._tt) clearTimeout(this._tt); if (this._off) this._off(); }
  renderVals() {
    var self = this, p = this.props, C = window.CVH, D = C.data();
    var DEMOS = {"Confirmation requested": {"persona": "amina", "scenario": "C", "basic": false, "choices": {"subscribed": false, "pendingPhone": "(416) 555-0123"}, "params": {"stage": "confirm"}}, "Confirmed by reply YES": {"persona": "amina", "scenario": "C", "basic": false, "params": {"stage": "confirmed"}}, "Groups changed by keyword": {"persona": "amina", "scenario": "C", "basic": false, "params": {"stage": "groups"}}, "Check-in withdrawn by keyword": {"persona": "amina", "scenario": "C", "basic": false, "params": {"stage": "checkin"}}, "Stopped": {"persona": "george", "scenario": "C", "basic": false, "params": {"stage": "stopped"}}, "Exercise: a drill sign-up on an enrolled ambassador phone": {"persona": "rashid", "scenario": "D", "exercise": true, "params": {"stage": "confirmed"}}}, keys = Object.keys(DEMOS);
    var demoKey = p.app ? null : (p.demo && DEMOS[p.demo] ? p.demo : keys[0]);
    var localToast = function (m) {
      if (self._tt) clearTimeout(self._tt);
      self.setState({ toast: typeof m === 'string' ? m : 'This artboard shows one screen. Open "Resident app" to click through.' });
      self._tt = setTimeout(function () { self.setState({ toast: null }); }, 2600);
    };
    var app = p.app || C.demoApp(DEMOS[demoKey] || {}, localToast);
    if (!p.app && p.fullh) app.h = p.fullh;
    var lang = app.lang || 'en', basic = !!app.basic, s = C.strings(lang);
    var locKey = p.app ? 'v' + (app.visit || 0) : 'd:' + demoKey;
    var locInit = (p.app ? (app.params || {}).loc : (DEMOS[demoKey] || {}).loc) || {};
    var patch = this.state.locKey === locKey ? this.state.loc : {};
    var loc = Object.assign({}, locInit, patch);
    var setLoc = function (x) { var cur = self.state.locKey === locKey ? self.state.loc : {}; self.setState({ locKey: locKey, loc: Object.assign({}, cur, x) }); };
    var b = { self: this, app: app, C: C, D: D, s: s, en: C.strings('en'), lang: lang, basic: basic, scn: app.scenario || D.defaultScenario,
      ch: app.choices || {}, params: app.params || {}, loc: loc, setLoc: setLoc, go: app.go, back: app.back, flags: app.flags || {},
      act: app.act || function (a) { return C.session.act(Object.assign({ exercise: !!app.exercise }, a)); }, session: C.session.model(),
      persona: app.persona || {}, standalone: !p.app,
      toast: function (m) { if (p.app) app.flash(m); else localToast(m); },
      ago: function (mins) { return C.ago(mins, lang); }, dur: function (mins) { return C.duration(mins, lang); },
      fill: C.fill };
    var chrome = 'none';
    var base = { app: app, lang: lang, basic: basic, s: s, bcp: C.bcp(lang), dir: C.dir(lang),
      rootClass: basic ? 'cvh-basic' : '', w: app.w || 360, h: app.h || 640, toast: this.state.toast,
      showHeader: chrome === 'full' || chrome === 'firstRun', headerVariant: chrome === 'firstRun' ? 'firstRun' : 'full',
      showNav: chrome === 'full', navActive: 'none', showExercise: 'R-06'[0] === 'A' && !!app.exercise,
      exEnded: 'R-06'[0] === 'A' && !app.exercise && !!(D.partner && D.partner.run && D.partner.run.state === 'ended' && D.partner.run.endedMinsAgo != null && D.partner.run.endedMinsAgo < 30 && (D.partner.run.enrolled || []).indexOf('AMB-' + String((app.persona || {}).name || '').toUpperCase()) >= 0) };
    return Object.assign(base, this.screenVals(b));
  }

  screenVals(b) {
    var C = b.C, s = b.s, ch = b.ch, prm = b.params, app = b.app, loc = b.loc;
    var T = this.smsThread(b, prm.stage || 'confirm');
    var toApp = function () { if (app.canBack) b.back(); else b.go('R-05'); };
    // Exercise: every message from the CVH carries the exercise word as its first line (X-10)
    var ex = !!app.exercise;
    T.msgs.forEach(function (m) { m.ex = ex && m.cls !== 'cvh-bubble--out'; });
    return { msgs: T.msgs.slice().reverse(), replies: T.replies, hasReplies: T.replies.length > 0, toApp: toApp, exNote: ex ? s.R06.exNote : '' };
  }
  // The subscription exchange, replayed from the keywords the resident has sent.
  // Shared shape with R-04's keyword states; everything works by text alone.
  smsThread(b, stage) {
    var C = b.C, s = b.s, ch = b.ch, app = b.app, loc = b.loc, self = this;
    var SEQ = { confirm: [], confirmed: ['YES'], groups: ['YES', 'GROUPS', '1'], checkin: ['YES', 'NOCHECK'], stopped: ['YES', 'STOP'] };
    var sent = (SEQ[stage] || []).concat(loc.sent || []);
    var langCode = app.chosenLang || (b.persona || {}).lang || b.lang;
    var lw = b.lang === 'en' ? C.lang(langCode).english : C.lang(langCode).native;
    var bo = ch.building ? C.building(ch.building) : null;
    var where = bo ? (ch.floor ? bo.name + ', ' + s.R35.floor.toLowerCase() + ' ' + ch.floor : bo.name) : ((s.neighbourhoods || {})[ch.nbhd || 'TP']);
    var g0 = loc.g0 || (ch.groups || []).filter(function (g) { return g !== 'checkin'; });
    if (!loc.g0 && !g0.length && stage === 'groups') g0 = ['seniors'];
    var ci0 = 'ci0' in loc ? loc.ci0 : (!!ch.checkin || stage === 'checkin');
    var groups = g0.slice(), ci = ci0, state = 'await';
    var msgs = [{ cls: '', lines: [C.fill(s.R04.confirmRequest, { lang: lw, where: where })], time: b.ago(3) }];
    var hin = function (lines) { msgs.push({ cls: '', lines: lines, time: s.R06.now }); };
    sent.forEach(function (k) {
      msgs.push({ cls: 'cvh-bubble--out', lines: [k], time: s.R06.now });
      if (k === 'YES' && state === 'await') { state = 'on'; hin([C.fill(s.R06.thanks, { where: where, lang: lw }), s.R06.howStop, s.R06.howChange].concat(ci ? [s.R04.checkinWithdraw] : [])); }
      else if (k === 'START' && state === 'stopped') { state = 'on'; hin([C.fill(s.R06.started, { where: where, lang: lw }), s.R06.howStop]); }
      else if (k === 'STOP') { state = 'stopped'; hin([s.R06.stopped]); }
      else if (k === 'GROUPS' && state === 'on') {
        if (!groups.length) hin([C.fill(s.R06.noGroups, { where: where })]);
        else { state = 'menu'; hin([C.fill(s.R06.groupsMenu, { list: groups.map(function (g, i) { return (i + 1) + ' ' + s.groups[g].label; }).join(', ') })]); }
      }
      else if (/^\d+$/.test(k) && state === 'menu') { var g = groups[+k - 1]; state = 'on'; if (g) { groups = groups.filter(function (y) { return y !== g; }); hin([C.fill(s.R06.groupsChanged, { group: s.groups[g].label }), s.R06.howStop]); } }
      else if (k === 'NOCHECK' && state === 'on' && ci) { ci = false; hin([s.R06.checkinWithdrawn, s.R06.howStop]); }
    });
    // What the resident can reply now. Each reply changes the same choices the app shows, at once.
    var send = function (k) {
      return function () {
        var patch = null;
        if ((k === 'YES' && state === 'await') || (k === 'START' && state === 'stopped')) patch = { subscribed: true, pendingPhone: null, phone: ch.phone || ch.pendingPhone || '(416) 555-0123' };
        if (k === 'STOP') patch = { subscribed: false, pendingPhone: null };
        if (/^\d+$/.test(k)) { var g = groups[+k - 1]; if (g) patch = { groups: (ch.groups || []).filter(function (y) { return y !== g; }) }; }
        if (k === 'NOCHECK') patch = { checkin: null, groups: (ch.groups || []).filter(function (y) { return y !== 'checkin'; }) };
        b.setLoc({ sent: (loc.sent || []).concat([k]), g0: g0, ci0: ci0 });
        if (patch) app.setChoices(patch);
      };
    };
    var keys = [];
    if (state === 'await') keys = ['YES', 'STOP'];
    else if (state === 'on') keys = (groups.length ? ['GROUPS'] : []).concat(ci ? ['NOCHECK'] : []).concat(['STOP']);
    else if (state === 'menu') keys = groups.map(function (g, i) { return String(i + 1); });
    else if (state === 'stopped') keys = ['START'];
    return { msgs: msgs, replies: keys.map(function (k) { return { label: k, send: send(k) }; }), state: state };
  }

}
</script>
</body>
</html>
