<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R-13 Organisation page</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/cvrh/components/bundle.css">
<link rel="stylesheet" href="cvh/cvh.css">
<script src="cvh/lib.js"></script>
<script src="cvh/data.js"></script>
<script src="cvh/inventory.js"></script>
<script src="cvh/icons.js"></script>
<script src="cvh/strings.en.js"></script>
<script src="cvh/strings.ur.js"></script>
<script src="cvh/strings.ps.js"></script>
<script src="cvh/strings.tl.js"></script>
<script src="cvh/strings.prs.js"></script>
<script src="cvh/strings.gu.js"></script>
<script src="cvh/strings.ta.js"></script>
<script src="cvh/strings.el.js"></script>
<script src="cvh/strings.sk.js"></script>
<script src="cvh/strings.bn.js"></script>
<script src="cvh/strings.hi.js"></script>
<script src="cvh/strings.pa.js"></script>
<script src="cvh/strings.zh.js"></script>
<script src="cvh/strings.es.js"></script>
<script src="cvh/strings.fr.js"></script>
<script src="cvh/strings.en.screens.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&amp;family=Noto+Sans:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400;700&amp;family=Noto+Sans+Devanagari:wght@400;700&amp;family=Noto+Sans+Gujarati:wght@400;700&amp;family=Noto+Sans+Bengali:wght@400;700&amp;family=Noto+Sans+Tamil:wght@400;700&amp;family=Noto+Sans+Gurmukhi:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#fafafa}</style>
</helmet>
<div class="cvh cvh-app {{rootClass}}" lang="{{bcp}}" dir="{{dir}}" style="width:{{w}}px;height:{{h}}px">
  <dc-import name="C_ProtoBar" screen-id="R-13" lang="{{lang}}" on-controls="{{app.openControls}}" embedded="{{true}}" hint-size="100%,28px"></dc-import>
  <sc-if value="{{showExercise}}"><dc-import name="X10_Exercise" lang="{{lang}}" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
  <sc-if value="{{exEnded}}"><dc-import name="X10_Exercise" state="ended" lang="{{lang}}" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
  <sc-if value="{{showHeader}}"><dc-import name="C_ResidentHeader" variant="{{headerVariant}}" lang="{{lang}}" basic="{{basic}}" basic-state="{{app.basicState}}" on-lang="{{app.openLang}}" on-choices="{{app.openChoices}}" on-basic="{{app.toggleBasic}}" embedded="{{true}}" hint-size="100%,116px"></dc-import></sc-if>
  <main class="cvh-main " aria-label="Organisation page">

<div class="cvh-screen">
  <button type="button" class="cvh-back" onClick="{{goBack}}"><span class="cvh-ico cvh-ico--back cvh-ico--sm" aria-hidden="true"></span>{{s.shell.back}}</button>
  <header class="cvh-stack" style="--gap:10px">
    <span class="cvh-tag" style="align-self:flex-start"><span class="cvh-ico cvh-ico--{{kind}} cvh-ico--sm" aria-hidden="true"></span>{{kindLabel}}</span>
    <h1 class="cvh-h1">{{name}}</h1>
    <sc-if value="{{about}}">
      <p class="cvh-lead">{{about}}</p>
      <span class="cvh-tag cvh-tag--illustrative" style="align-self:flex-start">{{s.R13.illustrative}}</span>
    </sc-if>
  </header>

  <section class="cvh-section" aria-labelledby="r13-services">
    <h2 class="cvh-h2" id="r13-services">{{servicesTitle}}</h2>
    <ul class="cvh-list">
      <sc-for list="{{items}}" as="r" hint-placeholder-count="4">
        <li class="cvh-result">
          <button type="button" class="cvh-result__name" onClick="{{r.open}}"><span class="cvh-grow">{{r.name}}</span><span class="cvh-ico cvh-ico--chevron cvh-ico--sm" aria-hidden="true"></span></button>
          <p class="cvh-result__line">{{r.firstLine}}</p>
          <div class="cvh-result__facts"><span class="cvh-fact cvh-strong"><span class="cvh-ico cvh-ico--{{r.openIcon}} cvh-ico--sm" aria-hidden="true"></span>{{r.openText}}</span></div>
        </li>
      </sc-for>
    </ul>
    <sc-if value="{{moreLabel}}"><button type="button" class="cvh-link" onClick="{{showAll}}">{{moreLabel}}<span class="cvh-ico cvh-ico--chevronDown cvh-ico--sm" aria-hidden="true"></span></button></sc-if>
  </section>

  <section class="cvh-section" aria-labelledby="r13-contact">
    <h2 class="cvh-h2" id="r13-contact">{{s.R13.contact}}</h2>
    <sc-if value="{{address}}"><p class="cvh-row" style="--gap:8px"><span class="cvh-ico cvh-ico--map cvh-ico--sm" aria-hidden="true"></span>{{address}}</p></sc-if>
    <sc-if value="{{phone}}"><button type="button" class="cvh-btn cvh-btn--primary cvh-btn--block" onClick="{{call}}"><span class="cvh-ico cvh-ico--phone cvh-ico--sm" aria-hidden="true"></span>{{callLabel}}</button></sc-if>
    <sc-if value="{{web}}"><button type="button" class="cvh-link" onClick="{{openWeb}}">{{s.R13.website}}<span class="cvh-ico cvh-ico--external cvh-ico--sm" aria-hidden="true"></span></button></sc-if>
  </section>

  <dc-import name="X01_Not911" variant="inline" lang="{{lang}}" basic="{{basic}}" embedded="{{true}}" hint-size="100%,60px"></dc-import>
</div>

  </main>
  <sc-if value="{{showNav}}"><dc-import name="C_ResidentNav" active="{{navActive}}" lang="{{lang}}" basic="{{basic}}" on-nav="{{app.go}}" embedded="{{true}}" hint-size="100%,64px"></dc-import></sc-if>
  <sc-if value="{{toast}}"><div class="cvh-toast" role="status" lang="en" dir="ltr"><span class="cvh-ico cvh-ico--info cvh-ico--sm" aria-hidden="true"></span><span class="cvh-grow">{{toast}}</span></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"demo":{"editor": "enum", "options": ["Default: The Neighbourhood Organization", "Default: Toronto Public Library", "Basic mode: The Neighbourhood Organization"], "default": "Default: The Neighbourhood Organization"},"embedded":{"editor":null},"fullh":{"editor":null},"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { toast: null, loc: {}, locKey: null, srev: 0 }; }
  componentDidMount() { var self = this; if (!this.props.app && window.CVH.session) this._off = window.CVH.session.on(function (st) { self.setState({ srev: st.rev }); }); }
  componentWillUnmount() { if (this._tt) clearTimeout(this._tt); if (this._off) this._off(); }
  renderVals() {
    var self = this, p = this.props, C = window.CVH, D = C.data();
    var DEMOS = {"Default: The Neighbourhood Organization": {"persona": "nasrin", "scenario": "C", "params": {"org": "TNO"}}, "Default: Toronto Public Library": {"persona": "george", "scenario": "C", "basic": false, "params": {"org": "TPL"}}, "Basic mode: The Neighbourhood Organization": {"persona": "george", "scenario": "C", "basic": true, "basicState": "helper", "params": {"org": "TNO"}}}, keys = Object.keys(DEMOS);
    var demoKey = p.app ? null : (p.demo && DEMOS[p.demo] ? p.demo : keys[0]);
    var localToast = function (m) {
      if (self._tt) clearTimeout(self._tt);
      self.setState({ toast: typeof m === 'string' ? m : 'This artboard shows one screen. Open "Resident app" to click through.' });
      self._tt = setTimeout(function () { self.setState({ toast: null }); }, 2600);
    };
    var app = p.app || C.demoApp(DEMOS[demoKey] || {}, localToast);
    if (!p.app && p.fullh) app.h = p.fullh;
    var lang = app.lang || 'en', basic = !!app.basic, s = C.strings(lang);
    var locKey = p.app ? 'v' + (app.visit || 0) : 'd:' + demoKey;
    var locInit = (p.app ? (app.params || {}).loc : (DEMOS[demoKey] || {}).loc) || {};
    var patch = this.state.locKey === locKey ? this.state.loc : {};
    var loc = Object.assign({}, locInit, patch);
    var setLoc = function (x) { var cur = self.state.locKey === locKey ? self.state.loc : {}; self.setState({ locKey: locKey, loc: Object.assign({}, cur, x) }); };
    var b = { self: this, app: app, C: C, D: D, s: s, en: C.strings('en'), lang: lang, basic: basic, scn: app.scenario || D.defaultScenario,
      ch: app.choices || {}, params: app.params || {}, loc: loc, setLoc: setLoc, go: app.go, back: app.back, flags: app.flags || {},
      act: app.act || function (a) { return C.session.act(Object.assign({ exercise: !!app.exercise }, a)); }, session: C.session.model(),
      persona: app.persona || {}, standalone: !p.app,
      toast: function (m) { if (p.app) app.flash(m); else localToast(m); },
      ago: function (mins) { return C.ago(mins, lang); }, dur: function (mins) { return C.duration(mins, lang); },
      fill: C.fill };
    var chrome = 'full';
    var base = { app: app, lang: lang, basic: basic, s: s, bcp: C.bcp(lang), dir: C.dir(lang),
      rootClass: basic ? 'cvh-basic' : '', w: app.w || 360, h: app.h || 640, toast: this.state.toast,
      showHeader: chrome === 'full' || chrome === 'firstRun', headerVariant: chrome === 'firstRun' ? 'firstRun' : 'full',
      showNav: chrome === 'full', navActive: 'help', showExercise: 'R-13'[0] === 'A' && !!app.exercise,
      exEnded: 'R-13'[0] === 'A' && !app.exercise && !!(D.partner && D.partner.run && D.partner.run.state === 'ended' && D.partner.run.endedMinsAgo != null && D.partner.run.endedMinsAgo < 30 && (D.partner.run.enrolled || []).indexOf('AMB-' + String((app.persona || {}).name || '').toUpperCase()) >= 0) };
    return Object.assign(base, this.screenVals(b));
  }

  screenVals(b) {
    var C = b.C, s = b.s, x = s.R13, prm = b.params, D = b.D;
    var id = prm.org || 'TNO';
    var page = (D.orgPages || []).filter(function (o) { return o.id === id; })[0] || null;
    var org = C.org(id) || {};
    var goBack = function () { if (b.app.canBack) b.back(); else b.go('R-09'); };
    if (!page && !org.name) return { name: x.notFound, items: [], goBack: goBack, kind: 'info', kindLabel: '' };
    var ids = page ? page.listings : (D.listings || []).filter(function (l) { return l.org === id; }).map(function (l) { return l.id; });
    var ls = ids.map(function (lid) { return C.listingFor(lid); }).filter(Boolean);
    var main = ls.filter(function (l) { return l.name === (page || org).name; })[0] || ls[0] || {};
    var icons = { open: 'check', closed: 'clock', unknown: 'info' };
    var all = ls.map(function (l) {
      var oi = C.openInfo(l, b.scn);
      return { name: l.name, firstLine: l.firstLine, openIcon: icons[oi.state], openText: oi.text,
        open: function () { b.go('R-12', { id: l.id, from: 'search' }); } };
    });
    var cap = b.basic && !b.loc.all ? 3 : 999;
    var kind = (page || org).kind || 'nonprofit';
    return {
      name: (page || org).name, kind: kind, kindLabel: (s.orgKinds || {})[kind] || kind, about: (x.aboutLines || {})[id] || '',
      servicesTitle: C.fill(x.servicesCount, { n: ls.length }), items: all.slice(0, cap),
      moreLabel: all.length > cap ? C.fill(x.showAll, { n: all.length }) : '', showAll: function () { b.setLoc({ all: true }); },
      address: main.address || '', phone: main.phone || '', web: main.web || '', callLabel: C.fill(x.call, { phone: main.phone || '' }),
      call: function () { b.toast(C.fill(x.callConfirm, { phone: main.phone })); },
      openWeb: function () { b.toast(C.fill(x.webConfirm, { web: String(main.web).replace(/^https?:\/\//, '').split('/')[0] })); },
      goBack: goBack
    };
  }

}
</script>
</body>
</html>
