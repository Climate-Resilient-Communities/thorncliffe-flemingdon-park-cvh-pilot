<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O-03 Audience — place</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/cvrh/components/bundle.css">
<link rel="stylesheet" href="cvh/cvh.css">
<script src="cvh/lib.js"></script>
<script src="cvh/data.js"></script>
<script src="cvh/inventory.js"></script>
<script src="cvh/icons.js"></script>
<script src="cvh/strings.en.js"></script>
<script src="cvh/strings.ur.js"></script>
<script src="cvh/strings.ps.js"></script>
<script src="cvh/strings.tl.js"></script>
<script src="cvh/strings.prs.js"></script>
<script src="cvh/strings.gu.js"></script>
<script src="cvh/strings.ta.js"></script>
<script src="cvh/strings.el.js"></script>
<script src="cvh/strings.sk.js"></script>
<script src="cvh/strings.bn.js"></script>
<script src="cvh/strings.hi.js"></script>
<script src="cvh/strings.pa.js"></script>
<script src="cvh/strings.zh.js"></script>
<script src="cvh/strings.es.js"></script>
<script src="cvh/strings.fr.js"></script>
<script src="cvh/strings.en.screens.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&amp;family=Noto+Sans:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400;700&amp;family=Noto+Sans+Devanagari:wght@400;700&amp;family=Noto+Sans+Gujarati:wght@400;700&amp;family=Noto+Sans+Bengali:wght@400;700&amp;family=Noto+Sans+Tamil:wght@400;700&amp;family=Noto+Sans+Gurmukhi:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#fafafa}</style>
</helmet>
<div class="cvh cvh-op cvh-hub {{layoutClass}} {{surfaceClass}}" lang="en" dir="ltr" style="width:{{w}}px;height:{{h}}px">
  <sc-if value="{{wide}}"><dc-import name="C_HubSide" active="O-03" in-disruption="{{inDisruption}}" on-nav="{{app.go}}" embedded="{{true}}" hint-size="240px,100%"></dc-import></sc-if>
  <div class="cvh-hubmain">
    <dc-import name="C_ProtoBar" screen-id="O-03" wide="{{wide}}" lang="en" on-controls="{{app.openControls}}" embedded="{{true}}" hint-size="100%,28px"></dc-import>
    <sc-if value="{{app.exercise}}"><dc-import name="X10_Exercise" lang="en" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
    <sc-if value="{{exEnded}}"><dc-import name="X10_Exercise" state="ended" lang="en" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
    <dc-import name="C_HubTop" screen-id="O-03" persona="{{app.persona}}" narrow="{{narrow}}" on-menu="{{app.openMenu}}" embedded="{{true}}" hint-size="100%,60px"></dc-import>
    <div class="cvh-hubbody ">

<div class="cvh-hpage cvh-ha-page">
  <sc-if value="{{exNoteLine}}"><p class="cvh-note" role="note"><span class="cvh-ico cvh-ico--exercise" aria-hidden="true"></span><span>{{exNoteLine}}</span></p></sc-if>
  <div class="cvh-ha-bar">
    <button type="button" class="cvh-back" onClick="{{goBack}}"><span class="cvh-ico cvh-ico--back cvh-ico--sm" aria-hidden="true"></span>{{backLabel}}</button>
    <nav class="cvh-ha-steps" aria-label="{{T.steps.label}}">
      <sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
        <button type="button" class="cvh-ha-step {{st.cls}}" aria-current="{{st.current}}" onClick="{{st.go}}"><span class="cvh-ha-step__n">{{st.n}}</span>{{st.label}}</button>
      </sc-for>
    </nav>
  </div>
  <p>{{x.lead}}</p>

  <div class="cvh-ha-cols {{colsCls}}">
    <div class="cvh-stack" style="--gap:22px">
      <section class="cvh-ha-sec" aria-labelledby="o03-nb">
        <h2 class="cvh-ha-sec__title" id="o03-nb">{{x.nbTitle}}</h2>
        <div class="cvh-ha-opts cvh-ha-opts--row">
          <sc-for list="{{nbs}}" as="n" hint-placeholder-count="2">
            <button type="button" class="cvh-option {{n.cls}}" role="checkbox" aria-checked="{{n.aria}}" onClick="{{n.toggle}}">
              <span class="cvh-option__box" aria-hidden="true"><sc-if value="{{n.on}}"><span class="cvh-ico cvh-ico--check cvh-ico--sm"></span></sc-if></span>
              <span class="cvh-option__text"><span class="cvh-option__label">{{n.label}}</span><span class="cvh-option__line">{{n.line}}</span></span>
            </button>
          </sc-for>
        </div>
      </section>

      <section class="cvh-ha-sec" aria-labelledby="o03-b">
        <h2 class="cvh-ha-sec__title" id="o03-b">{{x.bTitle}}<span class="cvh-tag cvh-tag--illustrative">{{x.addresses}}</span></h2>
        <div class="cvh-ha-search">
          <div class="cvh-field">
            <label class="cvh-label" for="o03-q">{{x.search}}</label>
            <input class="cvh-input" id="o03-q" type="search" autocomplete="off" placeholder="{{x.searchHint}}" value="{{q}}" onInput="{{onQ}}" onKeyDown="{{onKey}}">
          </div>
          <div class="cvh-ha-seg" role="group" aria-label="{{x.nbTitle}}">
            <sc-for list="{{segs}}" as="sg" hint-placeholder-count="3"><button type="button" class="{{sg.cls}}" aria-pressed="{{sg.aria}}" onClick="{{sg.pick}}">{{sg.label}}</button></sc-for>
          </div>
        </div>
        <p class="cvh-muted" role="status">{{showing}}</p>
        <sc-if value="{{noMatch}}"><p class="cvh-ha-readonly"><span class="cvh-ico cvh-ico--info cvh-ico--sm" aria-hidden="true"></span><span class="cvh-grow">{{noMatch}}</span></p></sc-if>
        <ul class="cvh-ha-list" aria-label="{{x.bTitle}}">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
            <li>
              <button type="button" class="cvh-ha-bld {{r.cls}}" role="checkbox" aria-checked="{{r.aria}}" disabled="{{r.locked}}" onClick="{{r.toggle}}">
                <span class="cvh-option__box" aria-hidden="true"><sc-if value="{{r.on}}"><span class="cvh-ico cvh-ico--check cvh-ico--sm"></span></sc-if></span>
                <span class="cvh-grow cvh-stack" style="--gap:0"><span class="cvh-ha-bld__name">{{r.name}}</span><span class="cvh-ha-bld__sub">{{r.sub}}</span></span>
                <sc-if value="{{r.sample}}"><span class="cvh-tag">{{x.sample}}</span></sc-if>
              </button>
            </li>
          </sc-for>
        </ul>
      </section>
    </div>

    <aside class="cvh-stack cvh-ha-aside" style="--gap:14px" aria-labelledby="o03-sel">
      <div class="cvh-ha-say" aria-live="polite">
        <p class="cvh-eyebrow" style="color:var(--ink)">{{x.whoTitle}}</p>
        <p class="cvh-ha-say__text">{{say}}</p>
        <sc-if value="{{names}}"><p>{{names}}</p></sc-if>
        <sc-if value="{{hh}}"><p class="cvh-row cvh-wrap" style="--gap:8px"><span>{{hh}}</span><span class="cvh-tag cvh-tag--illustrative">{{T.illustrative}}</span></p></sc-if>
        <sc-if value="{{groupsKept}}"><p class="cvh-muted">{{groupsKept}}</p></sc-if>
      </div>
      <div class="cvh-row"><h2 class="cvh-ha-sec__title cvh-grow" id="o03-sel">{{x.selTitle}}</h2><sc-if value="{{selCount}}"><span class="cvh-tag">{{selCount}}</span></sc-if></div>
      <sc-if value="{{none}}"><p class="cvh-muted">{{x.selNone}}</p></sc-if>
      <div class="cvh-ha-chips">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="2">
          <span class="cvh-chip cvh-chip--on">{{c.label}}<button type="button" class="cvh-chip__x" aria-label="{{c.aria}}" onClick="{{c.remove}}"><span class="cvh-ico cvh-ico--close cvh-ico--sm" aria-hidden="true"></span></button></span>
        </sc-for>
      </div>
      <sc-for list="{{cards}}" as="fc" hint-placeholder-count="1">
        <div class="cvh-ha-floorcard" role="group" aria-label="{{fc.title}}">
          <p class="cvh-strong">{{fc.title}}</p>
          <div class="cvh-ha-seg">
            <sc-for list="{{fc.modes}}" as="m" hint-placeholder-count="3"><button type="button" class="{{m.cls}}" aria-pressed="{{m.aria}}" onClick="{{m.pick}}">{{m.label}}</button></sc-for>
          </div>
          <sc-if value="{{fc.isRange}}">
            <div class="cvh-ha-range">
              <div class="cvh-field"><label class="cvh-label" for="{{fc.fromId}}">{{x.from}}</label>
                <select class="cvh-select" id="{{fc.fromId}}" value="{{fc.a}}" onChange="{{fc.setA}}"><sc-for list="{{fc.opts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}" selected="{{o.selA}}">{{o.v}}</option></sc-for></select></div>
              <div class="cvh-field"><label class="cvh-label" for="{{fc.toId}}">{{x.to}}</label>
                <select class="cvh-select" id="{{fc.toId}}" value="{{fc.b}}" onChange="{{fc.setB}}"><sc-for list="{{fc.opts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}" selected="{{o.selB}}">{{o.v}}</option></sc-for></select></div>
            </div>
          </sc-if>
          <sc-if value="{{fc.isList}}">
            <p class="cvh-muted">{{x.pickHint}}</p>
            <div class="cvh-ha-floors">
              <sc-for list="{{fc.grid}}" as="g" hint-placeholder-count="6"><button type="button" class="cvh-ha-floor {{g.cls}}" aria-pressed="{{g.aria}}" aria-label="{{g.aria2}}" onClick="{{g.toggle}}">{{g.n}}</button></sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </aside>
  </div>

  <div class="cvh-pubbar">
    <sc-if value="{{todo}}"><p class="cvh-grow">{{todo}}</p></sc-if>
    <sc-if value="{{noTodo}}"><span class="cvh-grow"></span></sc-if>
    <sc-if value="{{canAddGroup}}"><button type="button" class="cvh-btn cvh-btn--secondary" onClick="{{addGroup}}">{{x.addGroup}}</button></sc-if>
    <button type="button" class="cvh-btn cvh-btn--primary" onClick="{{cont}}" disabled="{{blocked}}">{{nextLabel}}<span class="cvh-ico cvh-ico--chevron cvh-ico--sm" aria-hidden="true"></span></button>
  </div>
</div>

    </div>
  </div>
  <sc-if value="{{toast}}"><div class="cvh-toast" role="status"><span class="cvh-ico cvh-ico--info cvh-ico--sm" aria-hidden="true"></span><span class="cvh-grow">{{toast}}</span></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"demo":{"editor": "enum", "options": ["Nothing selected", "Neighbourhood chosen", "Buildings found by search", "Floors in one building (Sample Tower B, 1 to 10)", "Floors picked one by one", "Mixed selection (a neighbourhood, and floors in another)", "Place for a group (seniors in one building)", "Exercise running"], "default": "Nothing selected"},"embedded":{"editor":null},"fullh":{"editor":null},"w":{"editor":null},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {

    var self = this, p = this.props, C = window.CVH, D = C.data();
    var DEMOS = {"Nothing selected": {"persona": "PRIYA", "params": {"draft": {"type": "water", "types": ["water"], "hazard": "water", "template": "TPL-ACK-FLOOD", "headline": "Water is off for a pipe repair", "notYetKnown": "When the water will be back on", "action": "Fill a jug of water now if you still can.", "aim": "place"}}}, "Neighbourhood chosen": {"persona": "PRIYA", "params": {"draft": {"type": "smoke", "types": ["smoke"], "hazard": "smoke", "template": "TPL-ACK-SMOKE", "headline": "Smoky air today", "action": "Keep windows closed.", "aim": "place", "place": {"nbhds": ["FP"], "blds": []}}}}, "Buildings found by search": {"persona": "PRIYA", "params": {"draft": {"type": "power", "types": ["power"], "hazard": "power", "template": "TPL-ACK-POWER", "headline": "Power is out", "action": "Keep your fridge and freezer closed.", "aim": "place", "place": {"nbhds": [], "blds": [{"id": "B01", "mode": "all"}, {"id": "B02", "mode": "all"}]}}}, "loc": {"q": "thorncliffe"}}, "Floors in one building (Sample Tower B, 1 to 10)": {"persona": "PRIYA", "params": {"draft": {"type": "water", "types": ["water"], "hazard": "water", "template": "TPL-ACK-FLOOD", "headline": "Water is off for a pipe repair", "notYetKnown": "When the water will be back on", "action": "Fill a jug of water now if you still can.", "aim": "place", "place": {"nbhds": [], "blds": [{"id": "SB", "mode": "range", "a": 1, "b": 10}]}}}}, "Floors picked one by one": {"persona": "PRIYA", "params": {"draft": {"type": "elevator", "types": ["elevator"], "hazard": "elevator", "template": "TPL-ACK-ELEVATOR", "headline": "Elevator is out", "action": "Use the stairs with care.", "aim": "place", "place": {"nbhds": [], "blds": [{"id": "SA", "mode": "list", "list": [3, 5, 9, 14]}]}}}}, "Mixed selection (a neighbourhood, and floors in another)": {"persona": "PRIYA", "params": {"draft": {"type": "power", "types": ["power"], "hazard": "power", "template": "TPL-ACK-POWER", "headline": "Power is out", "action": "Keep your fridge and freezer closed.", "aim": "place", "place": {"nbhds": ["FP"], "blds": [{"id": "SA", "mode": "range", "a": 1, "b": 8}, {"id": "SB", "mode": "range", "a": 1, "b": 8}, {"id": "SC", "mode": "all"}]}}}}, "Place for a group (seniors in one building)": {"persona": "PRIYA", "params": {"draft": {"id": "AL-06", "type": "heat", "types": ["heat"], "hazard": "heat", "template": "TPL-ACK-HEAT", "headline": "Very hot days until Friday", "action": "Go somewhere cool for a few hours each afternoon.", "aim": "both", "place": {"nbhds": [], "blds": [{"id": "SA", "mode": "all"}]}, "groups": {"cats": ["seniors"], "langs": []}}}}, "Exercise running": {"persona": "PRIYA", "params": {"draft": {"type": "water", "types": ["water"], "hazard": "water", "template": "TPL-ACK-FLOOD", "headline": "Water is off for a pipe repair", "notYetKnown": "When the water will be back on", "action": "Fill a jug of water now if you still can.", "aim": "place", "place": {"nbhds": [], "blds": [{"id": "SB", "mode": "range", "a": 1, "b": 10}]}}}, "exercise": true}}, keys = Object.keys(DEMOS);
    var demoKey = p.app ? null : (p.demo && DEMOS[p.demo] ? p.demo : keys[0]);
    var localToast = function (m) {
      if (self._tt) clearTimeout(self._tt);
      self.setState({ toast: typeof m === 'string' ? m : 'This artboard shows one screen. Open "Hub and partner space" to click through.' });
      self._tt = setTimeout(function () { self.setState({ toast: null }); }, 2600);

    var app = p.app || C.demoHubApp(DEMOS[demoKey] || {}, localToast);
    if (!p.app && p.fullh) app.h = p.fullh;
    if (!p.app && p.w) { app.w = p.w; app.narrow = p.w < 700; }
    var locKey = p.app ? 'v' + (app.visit || 0) : 'd:' + demoKey;
    var locInit = (p.app ? (app.params || {}).loc : (DEMOS[demoKey] || {}).loc) || {};
    var patch = this.state.locKey === locKey ? this.state.loc : {};
    var loc = Object.assign({}, locInit, patch);
    var setLoc = function (x) { var cur = self.state.locKey === locKey ? self.state.loc : {}; self.setState({ locKey: locKey, loc: Object.assign({}, cur, x) }); };
    var b = { self: this, app: app, C: C, D: D, s: C.strings('en'), h: C.strings('en').hub, params: app.params || {}, loc: loc, setLoc: setLoc,
      go: app.go, back: app.back, act: app.act, narrow: !!app.narrow, exercise: !!app.exercise, persona: C.person(app.persona || 'PRIYA') || {},
      session: C.session.model(), standalone: !p.app,
      toast: function (m) { if (p.app) app.flash(m); else localToast(m); },
      ago: function (mins) { return C.ago(mins, 'en'); }, dur: function (mins) { return C.duration(mins, 'en'); }, fill: C.fill };
    var sid = 'O-03', n = parseInt(sid.slice(2), 10);
    var partner = sid[0] === 'P' && n <= 10;
    var narrow = !!app.narrow;
    var base = { app: app, w: app.w || 1280, h: app.h || 800, narrow: narrow, wide: !narrow, toast: this.state.toast,
      exEnded: !app.exercise && !!(D.partner && D.partner.run && D.partner.run.state === 'ended' && D.partner.run.endedMinsAgo != null && D.partner.run.endedMinsAgo < 30),
      layoutClass: narrow ? 'cvh-hub--narrow' : '', surfaceClass: partner ? 'cvh-partner' : '', inDisruption: !!app.inDisruption || partner };
    return Object.assign(base, this.screenVals(b));
  }

  screenVals(b) { return Object.assign(this.screenValsX10(b), { exNoteLine: b.exercise ? b.s.O03.exNote : '' }); }
  screenValsX10(b) {

    var OPT = D.groupOptIns || {};

      var bs = (D.buildings || []).filter(function (B) { return B.nbhd === n; }), hh = 0;
      bs.forEach(function (B) { hh += (OPT[B.id] || {}).households || 0; });
      var on = nbOn(n);
      return { label: C.fill(x.nbAll, { nb: s.neighbourhoods[n] }), line: C.fill(x.nbLine, { n: bs.length, h: num(hh) }), on: on, cls: on ? 'is-on' : '', aria: on ? 'true' : 'false',

    });
    var q = String(loc.q || ''), nbf = loc.nbf || 'all', qq = q.trim().toLowerCase();
    var all = D.buildings || [];
    var match = all.filter(function (B) {
      if (nbf !== 'all' && B.nbhd !== nbf) return false;
      if (!qq) return true;
      var hay = (B.name + ' ' + (B.street || '') + ' ' + s.neighbourhoods[B.nbhd]).toLowerCase(), words = hay.split(/[\s,.]+/);
      // A street number or a single letter must match a whole word ("1" finds 1 Thorncliffe Park Drive, not 41; "Tower B" finds only B)
      return qq.split(/\s+/).every(function (t) { return /^\d+$/.test(t) || t.length < 2 ? words.indexOf(t) >= 0 : words.some(function (w) { return w.indexOf(t) === 0; }) || hay.indexOf(t) >= 0; });

      return { name: B.name, sub: sub, sample: !!B.sample, on: on, locked: inNb, cls: on ? 'is-on' : '', aria: on ? 'true' : 'false', toggle: function () { if (!inNb) toggleB(B); } };
    });
    var segs = [['all', x.all], ['TP', s.neighbourhoods.TP], ['FP', s.neighbourhoods.FP]].map(function (v) {
      var on = nbf === v[0]; return { label: v[1], cls: on ? 'is-on' : '', aria: on ? 'true' : 'false', pick: function () { b.setLoc({ nbf: v[0] }); } };
    });
    // Selection: chips and one floors card per building outside a chosen neighbourhood
    var chips = [], cards = [];
    pl.nbhds.forEach(function (n) {
      var lab = C.fill(x.nbAll, { nb: s.neighbourhoods[n] });
      chips.push({ label: lab, aria: C.fill(x.remove, { what: lab }), remove: function () { var p = H.clone(pl); p.nbhds = p.nbhds.filter(function (k) { return k !== n; }); upd(p); } });
    });
    pl.blds.forEach(function (sel, i) {
      var B = C.building(sel.id); if (!B || nbOn(B.nbhd)) return;
      var ft = H.floorsText(sel, B, false) || x.allFloors.toLowerCase();
      var lab = B.name + ' · ' + ft;
      chips.push({ label: lab, aria: C.fill(x.remove, { what: B.name }), remove: function () { toggleB(B); } });
      var patch = function (pp) { var p = H.clone(pl); p.blds[i] = Object.assign({}, p.blds[i], pp); upd(p); };
      var mode = sel.mode || 'all', a = +sel.a || 1, z = +sel.b || B.floors, list = sel.list || [];

      })(g);

          return { label: m[1], cls: on ? 'is-on' : '', aria: on ? 'true' : 'false', pick: function () { patch(m[0] === 'range' ? { mode: 'range', a: a, b: sel.mode === 'range' ? z : Math.min(B.floors, 10) } : { mode: m[0] }); } };
        }),
