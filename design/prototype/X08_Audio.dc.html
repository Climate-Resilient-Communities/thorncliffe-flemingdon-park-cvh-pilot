<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-08 Audio control</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/cvrh/components/bundle.css">
<link rel="stylesheet" href="cvh/cvh.css">
<script src="cvh/lib.js"></script>
<script src="cvh/data.js"></script>
<script src="cvh/inventory.js"></script>
<script src="cvh/icons.js"></script>
<script src="cvh/strings.en.js"></script>
<script src="cvh/strings.ur.js"></script>
<script src="cvh/strings.ps.js"></script>
<script src="cvh/strings.tl.js"></script>
<script src="cvh/strings.prs.js"></script>
<script src="cvh/strings.gu.js"></script>
<script src="cvh/strings.ta.js"></script>
<script src="cvh/strings.el.js"></script>
<script src="cvh/strings.sk.js"></script>
<script src="cvh/strings.bn.js"></script>
<script src="cvh/strings.hi.js"></script>
<script src="cvh/strings.pa.js"></script>
<script src="cvh/strings.zh.js"></script>
<script src="cvh/strings.es.js"></script>
<script src="cvh/strings.fr.js"></script>
<script src="cvh/strings.en.screens.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&amp;family=Noto+Sans:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400;700&amp;family=Noto+Sans+Devanagari:wght@400;700&amp;family=Noto+Sans+Gujarati:wght@400;700&amp;family=Noto+Sans+Bengali:wght@400;700&amp;family=Noto+Sans+Tamil:wght@400;700&amp;family=Noto+Sans+Gurmukhi:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#fafafa}</style>
</helmet>
<div class="cvh {{rootClass}}" lang="{{bcp}}" style="{{rootStyle}}">
  <div class="cvh-audio cvh-no-mirror {{failedClass}}" dir="ltr">
    <button type="button" class="cvh-audio__btn" onClick="{{toggle}}" aria-label="{{btnLabel}}" disabled="{{isLoading}}">
      <sc-if value="{{isLoading}}"><span class="cvh-audio__loading" aria-hidden="true"></span></sc-if>
      <sc-if value="{{showPause}}"><span class="cvh-ico cvh-ico--pause" aria-hidden="true"></span></sc-if>
      <sc-if value="{{showPlay}}"><span class="cvh-ico cvh-ico--play" aria-hidden="true"></span></sc-if>
      <sc-if value="{{isFailed}}"><span class="cvh-ico cvh-ico--retry" aria-hidden="true"></span></sc-if>
    </button>
    <div class="cvh-audio__meta" dir="{{dir}}" aria-live="polite">
      <span class="cvh-audio__label">{{label}}</span>
      <sc-if value="{{showBar}}">
        <div class="cvh-audio__bar" dir="ltr" role="progressbar" aria-valuemin="0" aria-valuemax="{{secs}}" aria-valuenow="{{pos}}"><div class="cvh-audio__fill" style="width: {{pct}}%"></div></div>
        <span class="cvh-audio__time">{{timeLine}}</span>
      </sc-if>
      <sc-if value="{{isFailed}}"><span class="cvh-audio__err">{{s.x08.failed}}</span></sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["idle","loading","playing","paused","failed"],"default":"idle"},"secs":{"editor":"int","default":40},"at":{"editor":"int","default":14},"variant":{"editor":"enum","options":["alert","section"],"default":"alert"},"failOnPlay":{"editor":"boolean","default":false},"lang":{"editor": "enum", "options": ["en", "ur", "ps", "tl", "prs", "gu", "ta", "el", "sk", "bn", "hi", "pa", "zh", "es", "fr"], "default": "en"},"basic":{"editor":"boolean","default":false},"embedded":{"editor":null},"$preview":{"width":360,"height":130}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { st: null, pos: null }; }
  componentWillUnmount() { this.stop(); }
  stop() { if (this._t) { clearInterval(this._t); this._t = null; } if (this._l) { clearTimeout(this._l); this._l = null; } }
  run() {
    var self = this; this.stop();
    this._t = setInterval(function () {
      var secs = self.props.secs || 40, pos = (self.state.pos || 0) + 1;
      if (pos >= secs) { self.stop(); self.setState({ st: 'idle', pos: 0 }); } else self.setState({ pos: pos });
    }, 1000);
  }
  renderVals() {
    var self = this, p = this.props, C = window.CVH, lang = p.lang || 'en', s = C.strings(lang);
    var st = this.state.st || p.state || 'idle';
    var secs = p.secs || 40;
    var pos = this.state.pos !== null ? this.state.pos : (st === 'playing' || st === 'paused' ? (p.at || 14) : 0);
    var len = C.seconds(secs, lang);
    var label = st === 'loading' ? s.x08.loading : st === 'playing' ? s.x08.playing : st === 'paused' ? s.x08.paused
      : C.fill(p.variant === 'section' ? s.x08.section : s.x08.idle, { t: len });
    var toggle = function () {
      var cur = self.state.st || self.props.state || 'idle';
      if (cur === 'playing') { self.stop(); self.setState({ st: 'paused', pos: pos }); return; }
      if (cur === 'paused') { self.setState({ st: 'playing', pos: pos }); self.run(); return; }
      self.setState({ st: 'loading', pos: pos });
      self._l = setTimeout(function () {
        if (self.props.failOnPlay) { self.setState({ st: 'failed' }); return; }
        self.setState({ st: 'playing', pos: 0 }); self.run();
      }, 900);
    };
    return { s: s, bcp: C.bcp(lang), dir: C.dir(lang), rootClass: p.basic ? 'cvh-basic' : '',
      rootStyle: p.embedded ? '' : 'width:360px;height:130px;padding:16px;background:#fafafa;',
      toggle: toggle, label: label, secs: secs, pos: pos, pct: Math.round(pos / secs * 100),
      isLoading: st === 'loading', showPause: st === 'playing', showPlay: st === 'idle' || st === 'paused', isFailed: st === 'failed',
      showBar: st === 'playing' || st === 'paused', failedClass: st === 'failed' ? 'cvh-audio--failed' : '',
      timeLine: C.fill(s.x08.left, { t: C.seconds(secs - pos, lang) }),
      btnLabel: st === 'playing' ? s.x08.pause : st === 'failed' ? s.x08.retry : s.x08.play };
  }
}
</script>
</body>
</html>
