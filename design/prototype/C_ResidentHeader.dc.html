<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resident header</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/cvrh/components/bundle.css">
<link rel="stylesheet" href="cvh/cvh.css">
<script src="cvh/lib.js"></script>
<script src="cvh/data.js"></script>
<script src="cvh/inventory.js"></script>
<script src="cvh/icons.js"></script>
<script src="cvh/strings.en.js"></script>
<script src="cvh/strings.ur.js"></script>
<script src="cvh/strings.ps.js"></script>
<script src="cvh/strings.tl.js"></script>
<script src="cvh/strings.prs.js"></script>
<script src="cvh/strings.gu.js"></script>
<script src="cvh/strings.ta.js"></script>
<script src="cvh/strings.el.js"></script>
<script src="cvh/strings.sk.js"></script>
<script src="cvh/strings.bn.js"></script>
<script src="cvh/strings.hi.js"></script>
<script src="cvh/strings.pa.js"></script>
<script src="cvh/strings.zh.js"></script>
<script src="cvh/strings.es.js"></script>
<script src="cvh/strings.fr.js"></script>
<script src="cvh/strings.en.screens.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&amp;family=Noto+Sans:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400;700&amp;family=Noto+Sans+Devanagari:wght@400;700&amp;family=Noto+Sans+Gujarati:wght@400;700&amp;family=Noto+Sans+Bengali:wght@400;700&amp;family=Noto+Sans+Tamil:wght@400;700&amp;family=Noto+Sans+Gurmukhi:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#fafafa}</style>
</helmet>
<div class="cvh {{rootClass}}" lang="{{bcp}}" dir="{{dir}}" style="{{rootStyle}}">
  <header class="cvh-rhead">
    <div class="cvh-rhead__top">
      <img class="cvh-rhead__logo" src="{{logo}}" alt="{{s.shell.hubLogoAlt}}">
      <button type="button" class="cvh-langbtn" onClick="{{lang_}}" aria-label="{{langAria}}">
        <span class="cvh-ico cvh-ico--globe cvh-ico--sm" aria-hidden="true"></span>
        <span class="cvh-langbtn__name" lang="{{bcp}}">{{native}}</span>
        <span class="cvh-ico cvh-ico--chevronDown cvh-ico--sm" aria-hidden="true"></span>
      </button>
    </div>
    <sc-if value="{{showTools}}">
      <div class="cvh-rhead__tools">
        <div>
          <dc-import name="X07_BasicMode" on="{{basic}}" state="{{basicState}}" on-toggle="{{basic_}}" compact="{{true}}" lang="{{lang}}" embedded="{{true}}" hint-size="100%,44px"></dc-import>
        </div>
        <button type="button" class="cvh-toolbtn" onClick="{{choices_}}">
          <span class="cvh-ico cvh-ico--choices cvh-ico--sm" aria-hidden="true"></span>
          <span>{{s.shell.choicesShort}}</span>
        </button>
      </div>
    </sc-if>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["full","firstRun"],"default":"full"},"onLang":{"editor":null},"onChoices":{"editor":null},"onBasic":{"editor":null},"basicState":{"editor":null},"lang":{"editor": "enum", "options": ["en", "ur", "ps", "tl", "prs", "gu", "ta", "el", "sk", "bn", "hi", "pa", "zh", "es", "fr"], "default": "en"},"basic":{"editor":"boolean","default":false},"embedded":{"editor":null},"$preview":{"width":360,"height":124}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this, p = this.props, C = window.CVH, lang = p.lang || 'en', s = C.strings(lang);
    var call = function (k) { return function () { if (self.props[k]) self.props[k](); }; };
    return { s: s, lang: lang, basic: !!p.basic, bcp: C.bcp(lang), dir: C.dir(lang), rootClass: p.basic ? 'cvh-basic' : '',
      rootStyle: p.embedded ? '' : 'width:360px;height:124px;background:#fafafa;',
      logo: C.logo.hub, native: C.lang(lang).native, langAria: s.shell.changeLanguage + ': ' + C.lang(lang).native,
      showTools: (p.variant || 'full') === 'full', basicState: p.basicState || (p.basic ? 'on' : 'off'),
      lang_: call('onLang'), choices_: call('onChoices'), basic_: p.onBasic ? call('onBasic') : null };
  }
}
</script>
</body>
</html>
