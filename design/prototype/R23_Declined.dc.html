<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R-23 Declined — reason and route to resubmit</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/cvrh/components/bundle.css">
<link rel="stylesheet" href="cvh/cvh.css">
<script src="cvh/lib.js"></script>
<script src="cvh/data.js"></script>
<script src="cvh/inventory.js"></script>
<script src="cvh/icons.js"></script>
<script src="cvh/strings.en.js"></script>
<script src="cvh/strings.ur.js"></script>
<script src="cvh/strings.ps.js"></script>
<script src="cvh/strings.tl.js"></script>
<script src="cvh/strings.prs.js"></script>
<script src="cvh/strings.gu.js"></script>
<script src="cvh/strings.ta.js"></script>
<script src="cvh/strings.el.js"></script>
<script src="cvh/strings.sk.js"></script>
<script src="cvh/strings.bn.js"></script>
<script src="cvh/strings.hi.js"></script>
<script src="cvh/strings.pa.js"></script>
<script src="cvh/strings.zh.js"></script>
<script src="cvh/strings.es.js"></script>
<script src="cvh/strings.fr.js"></script>
<script src="cvh/strings.en.screens.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&amp;family=Noto+Sans:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400;700&amp;family=Noto+Sans+Devanagari:wght@400;700&amp;family=Noto+Sans+Gujarati:wght@400;700&amp;family=Noto+Sans+Bengali:wght@400;700&amp;family=Noto+Sans+Tamil:wght@400;700&amp;family=Noto+Sans+Gurmukhi:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#fafafa}</style>
</helmet>
<div class="cvh cvh-app {{rootClass}}" lang="{{bcp}}" dir="{{dir}}" style="width:{{w}}px;height:{{h}}px">
  <dc-import name="C_ProtoBar" screen-id="R-23" lang="{{lang}}" on-controls="{{app.openControls}}" embedded="{{true}}" hint-size="100%,28px"></dc-import>
  <sc-if value="{{showExercise}}"><dc-import name="X10_Exercise" lang="{{lang}}" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
  <sc-if value="{{exEnded}}"><dc-import name="X10_Exercise" state="ended" lang="{{lang}}" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
  <sc-if value="{{showHeader}}"><dc-import name="C_ResidentHeader" variant="{{headerVariant}}" lang="{{lang}}" basic="{{basic}}" basic-state="{{app.basicState}}" on-lang="{{app.openLang}}" on-choices="{{app.openChoices}}" on-basic="{{app.toggleBasic}}" embedded="{{true}}" hint-size="100%,116px"></dc-import></sc-if>
  <main class="cvh-main " aria-label="Declined — reason and route to resubmit">

<div class="cvh-screen">
  <button type="button" class="cvh-back" onClick="{{goBack}}"><span class="cvh-ico cvh-ico--back cvh-ico--sm" aria-hidden="true"></span>{{s.shell.back}}</button>
  <h1 class="cvh-h1">{{s.R23.title}}</h1>
  <p class="cvh-caption cvh-muted">{{sentAgo}}</p>

  <section class="cvh-card cvh-stack" style="--gap:12px;border:2px solid var(--ink)" aria-label="{{s.R23.reason}}">
    <div class="cvh-kv"><span class="cvh-kv__k">{{s.R23.reason}}</span><p class="cvh-lead">{{why}}</p></div>
    <div class="cvh-kv"><span class="cvh-kv__k">{{s.R23.whatToChange}}</span><p class="cvh-lead cvh-strong">{{change}}</p></div>
  </section>
  <sc-if value="{{isAdvert}}"><p class="cvh-rules__market">{{s.x03.market}}</p></sc-if>

  <section class="cvh-section" aria-labelledby="r23-wrote">
    <h2 class="cvh-h3" id="r23-wrote">{{s.R23.youWrote}}</h2>
    <div class="cvh-card cvh-stack" style="--gap:8px">
      <sc-for list="{{wrote}}" as="w" hint-placeholder-count="3">
        <div class="cvh-kv"><span class="cvh-kv__k">{{w.k}}</span><span class="{{w.cls}}">{{w.v}}</span></div>
      </sc-for>
    </div>
    <p class="cvh-row" style="--gap:6px"><span class="cvh-ico cvh-ico--check cvh-ico--sm" aria-hidden="true"></span><span>{{s.R23.kept}}</span></p>
  </section>

  <button type="button" class="cvh-btn cvh-btn--primary cvh-btn--block cvh-btn--lg" onClick="{{resubmit}}"><span class="cvh-ico cvh-ico--pencil cvh-ico--sm" aria-hidden="true"></span>{{s.R23.resubmit}}</button>
  <button type="button" class="cvh-btn cvh-btn--secondary cvh-btn--block" onClick="{{toMap}}"><span class="cvh-ico cvh-ico--map cvh-ico--sm" aria-hidden="true"></span>{{s.R23.toMap}}</button>
  <dc-import name="X03_Rules" variant="link" on-open="{{toRules}}" lang="{{lang}}" basic="{{basic}}" embedded="{{true}}" hint-size="100%,48px"></dc-import>
</div>

  </main>
  <sc-if value="{{showNav}}"><dc-import name="C_ResidentNav" active="{{navActive}}" lang="{{lang}}" basic="{{basic}}" on-nav="{{app.go}}" embedded="{{true}}" hint-size="100%,64px"></dc-import></sc-if>
  <sc-if value="{{toast}}"><div class="cvh-toast" role="status" lang="en" dir="ltr"><span class="cvh-ico cvh-ico--info cvh-ico--sm" aria-hidden="true"></span><span class="cvh-grow">{{toast}}</span></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"demo":{"editor": "enum", "options": ["Reason stated: no location", "Reason stated: selling or advertising", "Reason stated: not clear what happens there", "Reason stated: already on the map", "Basic mode: no location"], "default": "Reason stated: no location"},"embedded":{"editor":null},"fullh":{"editor":null},"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { toast: null, loc: {}, locKey: null, srev: 0 }; }
  componentDidMount() { var self = this; if (!this.props.app && window.CVH.session) this._off = window.CVH.session.on(function (st) { self.setState({ srev: st.rev }); }); }
  componentWillUnmount() { if (this._tt) clearTimeout(this._tt); if (this._off) this._off(); }
  renderVals() {
    var self = this, p = this.props, C = window.CVH, D = C.data();
    var DEMOS = {"Reason stated: no location": {"persona": "yusuf", "scenario": "C", "params": {"submission": "SUB-08"}}, "Reason stated: selling or advertising": {"persona": "devon", "scenario": "C", "params": {"submission": "SUB-11"}}, "Reason stated: not clear what happens there": {"persona": "amina", "scenario": "C", "basic": false, "params": {"submission": "SUB-09"}}, "Reason stated: already on the map": {"persona": "devon", "scenario": "C", "params": {"submission": "SUB-08", "reason": "duplicate"}}, "Basic mode: no location": {"persona": "george", "scenario": "C", "basic": true, "basicState": "persisted", "params": {"submission": "SUB-08"}}}, keys = Object.keys(DEMOS);
    var demoKey = p.app ? null : (p.demo && DEMOS[p.demo] ? p.demo : keys[0]);
    var localToast = function (m) {
      if (self._tt) clearTimeout(self._tt);
      self.setState({ toast: typeof m === 'string' ? m : 'This artboard shows one screen. Open "Resident app" to click through.' });
      self._tt = setTimeout(function () { self.setState({ toast: null }); }, 2600);
    };
    var app = p.app || C.demoApp(DEMOS[demoKey] || {}, localToast);
    if (!p.app && p.fullh) app.h = p.fullh;
    var lang = app.lang || 'en', basic = !!app.basic, s = C.strings(lang);
    var locKey = p.app ? 'v' + (app.visit || 0) : 'd:' + demoKey;
    var locInit = (p.app ? (app.params || {}).loc : (DEMOS[demoKey] || {}).loc) || {};
    var patch = this.state.locKey === locKey ? this.state.loc : {};
    var loc = Object.assign({}, locInit, patch);
    var setLoc = function (x) { var cur = self.state.locKey === locKey ? self.state.loc : {}; self.setState({ locKey: locKey, loc: Object.assign({}, cur, x) }); };
    var b = { self: this, app: app, C: C, D: D, s: s, en: C.strings('en'), lang: lang, basic: basic, scn: app.scenario || D.defaultScenario,
      ch: app.choices || {}, params: app.params || {}, loc: loc, setLoc: setLoc, go: app.go, back: app.back, flags: app.flags || {},
      act: app.act || function (a) { return C.session.act(Object.assign({ exercise: !!app.exercise }, a)); }, session: C.session.model(),
      persona: app.persona || {}, standalone: !p.app,
      toast: function (m) { if (p.app) app.flash(m); else localToast(m); },
      ago: function (mins) { return C.ago(mins, lang); }, dur: function (mins) { return C.duration(mins, lang); },
      fill: C.fill };
    var chrome = 'full';
    var base = { app: app, lang: lang, basic: basic, s: s, bcp: C.bcp(lang), dir: C.dir(lang),
      rootClass: basic ? 'cvh-basic' : '', w: app.w || 360, h: app.h || 640, toast: this.state.toast,
      showHeader: chrome === 'full' || chrome === 'firstRun', headerVariant: chrome === 'firstRun' ? 'firstRun' : 'full',
      showNav: chrome === 'full', navActive: 'map', showExercise: 'R-23'[0] === 'A' && !!app.exercise,
      exEnded: 'R-23'[0] === 'A' && !app.exercise && !!(D.partner && D.partner.run && D.partner.run.state === 'ended' && D.partner.run.endedMinsAgo != null && D.partner.run.endedMinsAgo < 30 && (D.partner.run.enrolled || []).indexOf('AMB-' + String((app.persona || {}).name || '').toUpperCase()) >= 0) };
    return Object.assign(base, this.screenVals(b));
  }

  screenVals(b) {
    var C = b.C, D = b.D, s = b.s, x = s.R23, r19 = s.R19, prm = b.params, go = b.go;
    var sub = C.byId(D.moderation, prm.submission || 'SUB-08') || C.byId(D.moderation, 'SUB-08');
    // Each declined submission carries one pre-written reason (the O-10 set, D.declineReasons)
    var BY = { 'SUB-08': 'noLocation', 'SUB-09': 'unclear', 'SUB-10': 'advert', 'SUB-11': 'advert' };
    var rid = prm.reason || sub.decisionReason || BY[sub.id] || 'unclear';
    if ((D.declineReasons || []).indexOf(rid) < 0) rid = 'unclear';
    var R = x.reasons[rid] || {};
    var f = sub.fields || {};
    // The form, rebuilt from what they sent: nothing is typed twice
    var form = { resubmit: rid, type: sub.type === 'communityOffer' ? 'offer' : 'official', name: f.name || '', what: f.whatEn || f.what || '', cat: f.category || '' };
    if (f.location && f.location.kind && f.location.kind !== 'none') {
      form.where = { kind: 'address', text: f.location.textEn || f.location.text };
    }
    if (f.hours === 'notSure') form.hNotSure = true;
    else if (f.hours && typeof f.hours === 'object') { form.dFrom = {}; form.dTo = {}; Object.keys(f.hours).forEach(function (d) { form.dFrom[d] = f.hours[d][0]; form.dTo[d] = f.hours[d][1]; }); }
    form.cost = { free: 'free', lowCost: 'low', fee: 'fee', notSure: 'notSure' }[f.cost] || '';
    form.idq = f.idRequired || ''; form.step = f.stepFree || ''; form.langs = (f.languages || []).slice();
    var wrote = [
      { k: r19.name, v: form.name, cls: 'cvh-strong' },
      { k: r19.what, v: form.what, cls: '' },
      { k: r19.location, v: form.where ? form.where.text : x.whereNone, cls: form.where ? '' : 'cvh-strong' }];
    if (b.basic) wrote = wrote.slice(0, 2).concat(rid === 'noLocation' ? [wrote[2]] : []);
    return { sentAgo: C.fill(x.sentAgo, { t: b.ago((sub.daysAgo || 1) * 1440) }), why: R.why, change: R.change, isAdvert: rid === 'advert', wrote: wrote,
      resubmit: function () { go('R-19', { loc: form }); },
      toMap: function () { go('R-14'); }, toRules: function () { go('R-18', { mode: 'add' }); },
      goBack: function () { if (b.app.canBack) b.back(); else go('R-14'); } };
  }

}
</script>
</body>
</html>
