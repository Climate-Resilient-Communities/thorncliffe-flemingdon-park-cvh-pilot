<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-03 The rules of the space</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/cvrh/components/bundle.css">
<link rel="stylesheet" href="cvh/cvh.css">
<script src="cvh/lib.js"></script>
<script src="cvh/data.js"></script>
<script src="cvh/inventory.js"></script>
<script src="cvh/icons.js"></script>
<script src="cvh/strings.en.js"></script>
<script src="cvh/strings.ur.js"></script>
<script src="cvh/strings.ps.js"></script>
<script src="cvh/strings.tl.js"></script>
<script src="cvh/strings.prs.js"></script>
<script src="cvh/strings.gu.js"></script>
<script src="cvh/strings.ta.js"></script>
<script src="cvh/strings.el.js"></script>
<script src="cvh/strings.sk.js"></script>
<script src="cvh/strings.bn.js"></script>
<script src="cvh/strings.hi.js"></script>
<script src="cvh/strings.pa.js"></script>
<script src="cvh/strings.zh.js"></script>
<script src="cvh/strings.es.js"></script>
<script src="cvh/strings.fr.js"></script>
<script src="cvh/strings.en.screens.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&amp;family=Noto+Sans:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400;700&amp;family=Noto+Sans+Devanagari:wght@400;700&amp;family=Noto+Sans+Gujarati:wght@400;700&amp;family=Noto+Sans+Bengali:wght@400;700&amp;family=Noto+Sans+Tamil:wght@400;700&amp;family=Noto+Sans+Gurmukhi:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#fafafa}</style>
</helmet>
<div class="cvh {{rootClass}}" lang="{{bcp}}" dir="{{dir}}" style="{{rootStyle}}">
  <sc-if value="{{isFull}}" hint-placeholder-val="{{true}}">
    <section class="cvh-rules" aria-labelledby="rules-title">
      <h2 class="cvh-h2" id="rules-title">{{s.x03.title}}</h2>
      <p>{{s.x03.intro}}</p>
      <ul class="cvh-rules__list">
        <sc-for list="{{rules}}" as="r" hint-placeholder-count="4">
          <li class="cvh-rules__item"><span class="cvh-ico cvh-ico--check cvh-ico--sm" aria-hidden="true" style="margin-top:4px"></span><span>{{r.text}}</span></li>
        </sc-for>
      </ul>
      <p class="cvh-rules__market">{{s.x03.market}}</p>
      <p class="cvh-caption cvh-muted">{{s.x03.review}}</p>
    </section>
  </sc-if>
  <sc-if value="{{isLink}}">
    <button type="button" class="cvh-btn cvh-btn--quiet" onClick="{{open}}"><span class="cvh-ico cvh-ico--doc cvh-ico--sm" aria-hidden="true"></span>{{s.x03.readMore}}</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["full","link"],"default":"full"},"onOpen":{"editor":null},"lang":{"editor": "enum", "options": ["en", "ur", "ps", "tl", "prs", "gu", "ta", "el", "sk", "bn", "hi", "pa", "zh", "es", "fr"], "default": "en"},"basic":{"editor":"boolean","default":false},"embedded":{"editor":null},"$preview":{"width":360,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this, p = this.props, C = window.CVH, lang = p.lang || 'en', s = C.strings(lang);
    var rules = (s.x03.rules || []).map(function (t) { return { text: t }; });
    return { s: s, bcp: C.bcp(lang), dir: C.dir(lang), rootClass: p.basic ? 'cvh-basic' : '',
      rootStyle: p.embedded ? '' : 'width:360px;height:560px;padding:16px;background:#fafafa;overflow:hidden;',
      isFull: (p.variant || 'full') === 'full', isLink: p.variant === 'link', rules: rules,
      open: function () { if (self.props.onOpen) self.props.onOpen(); } };
  }
}
</script>
</body>
</html>
