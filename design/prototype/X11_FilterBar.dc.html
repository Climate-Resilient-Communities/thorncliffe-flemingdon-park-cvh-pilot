<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-11 Applied-filter bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/cvrh/components/bundle.css">
<link rel="stylesheet" href="cvh/cvh.css">
<script src="cvh/lib.js"></script>
<script src="cvh/data.js"></script>
<script src="cvh/inventory.js"></script>
<script src="cvh/icons.js"></script>
<script src="cvh/strings.en.js"></script>
<script src="cvh/strings.ur.js"></script>
<script src="cvh/strings.ps.js"></script>
<script src="cvh/strings.tl.js"></script>
<script src="cvh/strings.prs.js"></script>
<script src="cvh/strings.gu.js"></script>
<script src="cvh/strings.ta.js"></script>
<script src="cvh/strings.el.js"></script>
<script src="cvh/strings.sk.js"></script>
<script src="cvh/strings.bn.js"></script>
<script src="cvh/strings.hi.js"></script>
<script src="cvh/strings.pa.js"></script>
<script src="cvh/strings.zh.js"></script>
<script src="cvh/strings.es.js"></script>
<script src="cvh/strings.fr.js"></script>
<script src="cvh/strings.en.screens.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&amp;family=Noto+Sans:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400;700&amp;family=Noto+Sans+Devanagari:wght@400;700&amp;family=Noto+Sans+Gujarati:wght@400;700&amp;family=Noto+Sans+Bengali:wght@400;700&amp;family=Noto+Sans+Tamil:wght@400;700&amp;family=Noto+Sans+Gurmukhi:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#fafafa}</style>
</helmet>
<div class="cvh {{rootClass}}" lang="{{bcp}}" dir="{{dir}}" style="{{rootStyle}}">
  <div class="cvh-fbar" role="region" aria-label="{{s.x11.title}}">
    <sc-if value="{{hasFilters}}">
      <div class="cvh-row" style="--gap:8px">
        <span class="cvh-ico cvh-ico--filter cvh-ico--sm" aria-hidden="true"></span>
        <span class="cvh-strong cvh-caption">{{s.x11.title}}</span>
      </div>
      <div class="cvh-fbar__chips">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
          <span class="cvh-chip cvh-chip--on">
            <sc-if value="{{c.fromChoices}}"><span class="cvh-ico cvh-ico--choices cvh-ico--sm" aria-hidden="true"></span></sc-if>
            <span>{{c.label}}</span>
            <button type="button" class="cvh-chip__x" onClick="{{c.remove}}" aria-label="{{c.removeLabel}}"><span class="cvh-ico cvh-ico--close cvh-ico--sm" aria-hidden="true"></span></button>
          </span>
        </sc-for>
      </div>
      <sc-if value="{{hidingLine}}"><p class="cvh-fbar__count">{{hidingLine}}</p></sc-if>
      <sc-if value="{{anyFromChoices}}"><p class="cvh-fbar__origin">{{s.x11.fromChoices}}</p></sc-if>
    </sc-if>
    <sc-if value="{{noFilters}}"><p class="cvh-fbar__count">{{s.x11.none}}</p></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"filters":{"editor":null},"hiding":{"editor":"int","default":14},"onRemove":{"editor":null},"lang":{"editor": "enum", "options": ["en", "ur", "ps", "tl", "prs", "gu", "ta", "el", "sk", "bn", "hi", "pa", "zh", "es", "fr"], "default": "en"},"basic":{"editor":"boolean","default":false},"embedded":{"editor":null},"$preview":{"width":360,"height":200}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { removed: [] }; }
  renderVals() {
    var self = this, p = this.props, C = window.CVH, lang = p.lang || 'en', s = C.strings(lang), sh = s.filters.short;
    var base = p.filters || [
      { id: 'openNow', label: sh.openNow }, { id: 'free', label: sh.free }, { id: 'noId', label: sh.noId, fromChoices: true }];
    var list = base.filter(function (f) { return self.state.removed.indexOf(f.id) < 0; });
    var hiding = Math.max(0, (p.hiding != null ? p.hiding : 14) - (base.length - list.length) * 4);
    var chips = list.map(function (f) {
      return { label: f.label, fromChoices: !!f.fromChoices, removeLabel: C.fill(s.x11.remove, { f: f.label }),
        remove: function () { if (self.props.onRemove) self.props.onRemove(f.id); else self.setState({ removed: self.state.removed.concat([f.id]) }); } };
    });
    return { s: s, bcp: C.bcp(lang), dir: C.dir(lang), rootClass: p.basic ? 'cvh-basic' : '',
      rootStyle: p.embedded ? '' : 'width:360px;height:200px;background:#fafafa;',
      chips: chips, hasFilters: chips.length > 0, noFilters: chips.length === 0,
      anyFromChoices: chips.some(function (c) { return c.fromChoices; }),
      hidingLine: hiding === 0 ? '' : hiding === 1 ? s.x11.hidingOne : C.fill(s.x11.hiding, { n: hiding }) };
  }
}
</script>
</body>
</html>
