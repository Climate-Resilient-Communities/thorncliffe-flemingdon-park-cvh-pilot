<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R-03 Home / Now</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/cvrh/components/bundle.css">
<link rel="stylesheet" href="cvh/cvh.css">
<script src="cvh/lib.js"></script>
<script src="cvh/data.js"></script>
<script src="cvh/inventory.js"></script>
<script src="cvh/icons.js"></script>
<script src="cvh/strings.en.js"></script>
<script src="cvh/strings.ur.js"></script>
<script src="cvh/strings.ps.js"></script>
<script src="cvh/strings.tl.js"></script>
<script src="cvh/strings.prs.js"></script>
<script src="cvh/strings.gu.js"></script>
<script src="cvh/strings.ta.js"></script>
<script src="cvh/strings.el.js"></script>
<script src="cvh/strings.sk.js"></script>
<script src="cvh/strings.bn.js"></script>
<script src="cvh/strings.hi.js"></script>
<script src="cvh/strings.pa.js"></script>
<script src="cvh/strings.zh.js"></script>
<script src="cvh/strings.es.js"></script>
<script src="cvh/strings.fr.js"></script>
<script src="cvh/strings.en.screens.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&amp;family=Noto+Sans:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400;700&amp;family=Noto+Sans+Devanagari:wght@400;700&amp;family=Noto+Sans+Gujarati:wght@400;700&amp;family=Noto+Sans+Bengali:wght@400;700&amp;family=Noto+Sans+Tamil:wght@400;700&amp;family=Noto+Sans+Gurmukhi:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#fafafa}</style>
</helmet>
<div class="cvh cvh-app {{rootClass}}" lang="{{bcp}}" dir="{{dir}}" style="width:{{w}}px;height:{{h}}px">
  <dc-import name="C_ProtoBar" screen-id="R-03" lang="{{lang}}" on-controls="{{app.openControls}}" embedded="{{true}}" hint-size="100%,28px"></dc-import>
  <sc-if value="{{showExercise}}"><dc-import name="X10_Exercise" lang="{{lang}}" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
  <sc-if value="{{exEnded}}"><dc-import name="X10_Exercise" state="ended" lang="{{lang}}" embedded="{{true}}" hint-size="100%,60px"></dc-import></sc-if>
  <sc-if value="{{showHeader}}"><dc-import name="C_ResidentHeader" variant="{{headerVariant}}" lang="{{lang}}" basic="{{basic}}" basic-state="{{app.basicState}}" on-lang="{{app.openLang}}" on-choices="{{app.openChoices}}" on-basic="{{app.toggleBasic}}" embedded="{{true}}" hint-size="100%,116px"></dc-import></sc-if>
  <main class="cvh-main " aria-label="Home / Now">

<div class="cvh-screen">
  <sc-if value="{{showGetAlerts}}">
    <button type="button" class="cvh-topbtn" onClick="{{toSignup}}">
      <span class="cvh-ico cvh-ico--phone cvh-ico--lg" aria-hidden="true"></span>
      <span class="cvh-grow">{{s.R03.getTextAlerts}}<span class="cvh-topbtn__line cvh-hide-basic">{{s.R03.getTextAlertsLine}}</span></span>
      <span class="cvh-ico cvh-ico--chevron" aria-hidden="true"></span>
    </button>
  </sc-if>
  <sc-if value="{{showPending}}">
    <div class="cvh-note" role="status"><span class="cvh-ico cvh-ico--phone" aria-hidden="true"></span><span class="cvh-grow">{{s.R03.sent}}</span></div>
  </sc-if>

  <sc-if value="{{amb}}">
    <button type="button" class="cvh-dest" onClick="{{amb.go}}" style="border-width:2px;border-color:var(--ink)">
      <span class="cvh-ico cvh-ico--building" aria-hidden="true"></span>
      <span class="cvh-grow cvh-stack" style="--gap:2px"><span>{{s.R03.ambassadorHome}}</span><span class="cvh-caption" style="font-weight:400">{{amb.line}}</span></span>
      <span class="cvh-ico cvh-ico--chevron" aria-hidden="true"></span>
    </button>
  </sc-if>
  <section class="cvh-section" aria-labelledby="r03-now">
    <h1 class="cvh-section__title" id="r03-now">{{s.R03.alertsNow}}</h1>
    <sc-if value="{{noBuilding}}">
      <button type="button" class="cvh-link" onClick="{{toWhere}}"><span class="cvh-ico cvh-ico--building cvh-ico--sm" aria-hidden="true"></span>{{s.R03.noBuildingChosen}}</button>
    </sc-if>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div class="cvh-stack" style="--gap:10px">
        <h2 class="cvh-section__sub">{{g.label}}</h2>
        <sc-for list="{{g.cards}}" as="c" hint-placeholder-count="1">
          <article class="cvh-acard {{c.cls}}">
            <div class="cvh-acard__head">
              <dc-import name="X13_DisruptionType" types="{{c.types}}" surface="screen" lang="{{lang}}" basic="{{basic}}" embedded="{{true}}" hint-size="140px,44px"></dc-import>
              <sc-if value="{{c.ongoing}}"><span class="cvh-tag">{{c.ongoing}}</span></sc-if>
              <sc-if value="{{c.myFloor}}"><span class="cvh-tag">{{s.R03.myFloor}}</span></sc-if>
            </div>
            <button type="button" class="cvh-acard__open" onClick="{{c.open}}"><span class="cvh-grow">{{c.headline}}</span><span class="cvh-ico cvh-ico--chevron" aria-hidden="true"></span></button>
            <dc-import name="X02_Origin" dc-props="{{c.origin}}" lang="{{lang}}" basic="{{basic}}" on-open="{{c.verified}}" embedded="{{true}}" hint-size="100%,90px"></dc-import>
            <p class="cvh-acard__meta">{{c.meta}}</p>
          </article>
        </sc-for>
      </div>
    </sc-for>
    <sc-if value="{{nothing}}">
      <div class="cvh-card cvh-stack" style="--gap:6px">
        <p class="cvh-h3">{{s.R03.nothingActive}}</p>
        <p class="cvh-hide-basic">{{s.R03.nothingActiveBody}}</p>
      </div>
    </sc-if>
    <button type="button" class="cvh-link" onClick="{{toArchive}}"><span class="cvh-ico cvh-ico--clock cvh-ico--sm" aria-hidden="true"></span>{{s.R03.archive}}</button>
  </section>

  <sc-if value="{{headsUp}}">
    <section class="cvh-card cvh-stack" style="--gap:10px;background:var(--surface-warm);border-color:var(--surface-warm)" aria-labelledby="r03-hu">
      <p class="cvh-eyebrow">{{s.R03.headsUpFrom}}</p>
      <h2 class="cvh-h3" id="r03-hu">{{s.R03.headsUpTitle}}</h2>
      <ul class="cvh-tailored__list">
        <sc-for list="{{headsUp.actions}}" as="t" hint-placeholder-count="2">
          <li class="cvh-tailored__item" style="font-size:var(--fs-body)"><span class="cvh-ico cvh-ico--arrow cvh-ico--sm" aria-hidden="true"></span><span>{{t}}</span></li>
        </sc-for>
      </ul>
      <div class="cvh-row cvh-wrap" style="--gap:8px">
        <button type="button" class="cvh-btn cvh-btn--secondary" onClick="{{headsUp.guide}}">{{s.R03.headsUpGuide}}</button>
        <sc-if value="{{headsUp.showPlace}}"><button type="button" class="cvh-btn cvh-btn--quiet" onClick="{{headsUp.place}}">{{headsUp.placeName}}</button></sc-if>
      </div>
    </section>
  </sc-if>

  <section class="cvh-section" aria-labelledby="r03-every">
    <h1 class="cvh-section__title" id="r03-every">{{s.R03.everyday}}</h1>
    <sc-for list="{{dests}}" as="d" hint-placeholder-count="3">
      <button type="button" class="cvh-dest" onClick="{{d.go}}">
        <span class="cvh-ico cvh-ico--{{d.icon}}" aria-hidden="true"></span>
        <span class="cvh-grow cvh-stack" style="--gap:2px"><span>{{d.label}}</span><span class="cvh-caption cvh-hide-basic" style="font-weight:400">{{d.line}}</span></span>
        <span class="cvh-ico cvh-ico--chevron" aria-hidden="true"></span>
      </button>
    </sc-for>
  </section>

  <dc-import name="X01_Not911" variant="inline" lang="{{lang}}" basic="{{basic}}" embedded="{{true}}" hint-size="100%,60px"></dc-import>
</div>

  </main>
  <sc-if value="{{showNav}}"><dc-import name="C_ResidentNav" active="{{navActive}}" lang="{{lang}}" basic="{{basic}}" on-nav="{{app.go}}" embedded="{{true}}" hint-size="100%,64px"></dc-import></sc-if>
  <sc-if value="{{toast}}"><div class="cvh-toast" role="status" lang="en" dir="ltr"><span class="cvh-ico cvh-ico--info cvh-ico--sm" aria-hidden="true"></span><span class="cvh-grow">{{toast}}</span></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"demo":{"editor": "enum", "options": ["Ordinary Tuesday, heads-up on (George)", "Heat wave: official and community alert (Amina)", "Power outage: my building first (Yusuf)", "Long disruption, one alert (Scenario G)", "First visit, nothing chosen", "Signed up, waiting for YES", "Basic mode: heat wave (Amina)", "Basic mode: nothing active (George)"], "default": "Ordinary Tuesday, heads-up on (George)"},"embedded":{"editor":null},"fullh":{"editor":null},"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { toast: null, loc: {}, locKey: null, srev: 0 }; }
  componentDidMount() { var self = this; if (!this.props.app && window.CVH.session) this._off = window.CVH.session.on(function (st) { self.setState({ srev: st.rev }); }); }
  componentWillUnmount() { if (this._tt) clearTimeout(this._tt); if (this._off) this._off(); }
  renderVals() {
    var self = this, p = this.props, C = window.CVH, D = C.data();
    var DEMOS = {"Ordinary Tuesday, heads-up on (George)": {"persona": "george", "scenario": "C", "basic": false, "choices": {"headsUp": true}}, "Heat wave: official and community alert (Amina)": {"persona": "amina", "scenario": "B", "basic": false}, "Power outage: my building first (Yusuf)": {"persona": "yusuf", "scenario": "A"}, "Long disruption, one alert (Scenario G)": {"persona": "george", "scenario": "G", "basic": false, "choices": {"building": "SA", "floor": 3}}, "First visit, nothing chosen": {"persona": "new", "scenario": "C"}, "Signed up, waiting for YES": {"persona": "nasrin", "scenario": "C", "choices": {"pendingPhone": "(416) 555-0148"}}, "Basic mode: heat wave (Amina)": {"persona": "amina", "scenario": "B", "basic": true, "basicState": "persisted"}, "Basic mode: nothing active (George)": {"persona": "george", "scenario": "C", "basic": true, "basicState": "helper", "choices": {"headsUp": true}}}, keys = Object.keys(DEMOS);
    var demoKey = p.app ? null : (p.demo && DEMOS[p.demo] ? p.demo : keys[0]);
    var localToast = function (m) {
      if (self._tt) clearTimeout(self._tt);
      self.setState({ toast: typeof m === 'string' ? m : 'This artboard shows one screen. Open "Resident app" to click through.' });
      self._tt = setTimeout(function () { self.setState({ toast: null }); }, 2600);
    };
    var app = p.app || C.demoApp(DEMOS[demoKey] || {}, localToast);
    if (!p.app && p.fullh) app.h = p.fullh;
    var lang = app.lang || 'en', basic = !!app.basic, s = C.strings(lang);
    var locKey = p.app ? 'v' + (app.visit || 0) : 'd:' + demoKey;
    var locInit = (p.app ? (app.params || {}).loc : (DEMOS[demoKey] || {}).loc) || {};
    var patch = this.state.locKey === locKey ? this.state.loc : {};
    var loc = Object.assign({}, locInit, patch);
    var setLoc = function (x) { var cur = self.state.locKey === locKey ? self.state.loc : {}; self.setState({ locKey: locKey, loc: Object.assign({}, cur, x) }); };
    var b = { self: this, app: app, C: C, D: D, s: s, en: C.strings('en'), lang: lang, basic: basic, scn: app.scenario || D.defaultScenario,
      ch: app.choices || {}, params: app.params || {}, loc: loc, setLoc: setLoc, go: app.go, back: app.back, flags: app.flags || {},
      act: app.act || function (a) { return C.session.act(Object.assign({ exercise: !!app.exercise }, a)); }, session: C.session.model(),
      persona: app.persona || {}, standalone: !p.app,
      toast: function (m) { if (p.app) app.flash(m); else localToast(m); },
      ago: function (mins) { return C.ago(mins, lang); }, dur: function (mins) { return C.duration(mins, lang); },
      fill: C.fill };
    var chrome = 'full';
    var base = { app: app, lang: lang, basic: basic, s: s, bcp: C.bcp(lang), dir: C.dir(lang),
      rootClass: basic ? 'cvh-basic' : '', w: app.w || 360, h: app.h || 640, toast: this.state.toast,
      showHeader: chrome === 'full' || chrome === 'firstRun', headerVariant: chrome === 'firstRun' ? 'firstRun' : 'full',
      showNav: chrome === 'full', navActive: 'now', showExercise: 'R-03'[0] === 'A' && !!app.exercise,
      exEnded: 'R-03'[0] === 'A' && !app.exercise && !!(D.partner && D.partner.run && D.partner.run.state === 'ended' && D.partner.run.endedMinsAgo != null && D.partner.run.endedMinsAgo < 30 && (D.partner.run.enrolled || []).indexOf('AMB-' + String((app.persona || {}).name || '').toUpperCase()) >= 0) };
    return Object.assign(base, this.screenVals(b));
  }

  screenVals(b) {
    var C = b.C, s = b.s, x = s.R03, ch = b.ch, go = b.go, D = b.D;
    var sa = C.scenarioAlerts(b.scn);
    var myB = ch.building ? C.building(ch.building) : null;
    var card = function (sn) {
      var a = sn.a, o = C.originProps(sn);
      var ongoing = a.ongoingDays && sn.day ? C.fill(x.ongoingDay, { n: sn.day, total: a.ongoingDays }) : '';
      var pl = (a.audience || {}).place, myFloor = false;
      if (pl && pl.floors && ch.floor && pl.buildings && pl.buildings.indexOf(ch.building) >= 0) myFloor = ch.floor >= pl.floors[0] && ch.floor <= pl.floors[1];
      var meta = sn.entries.length > 1 ? C.fill(x.updated, { t: b.ago(sn.updatedMins) }) : C.fill(x.posted, { t: b.ago(sn.postedMins) });
      return { sn: sn, types: a.types, headline: a.headline, origin: o, ongoing: ongoing, myFloor: myFloor, meta: meta,
        cls: o.origin === 'official' ? 'cvh-acard--official' : '',
        open: function () { go('R-07', { alert: a.id }); }, verified: function () { go('R-28', { alert: a.id }); } };
    };
    var cards = sa.active.map(card);
    var mine = cards.filter(function (c) { return myB && C.affectsBuilding(c.sn.a, ch.building, ch.floor); });
    var rest = cards.filter(function (c) { return mine.indexOf(c) < 0; });
    // Official alerts sit beside the community alert that relays them, community first (it says what to do here).
    rest.sort(function (p, q) { return (p.origin.origin === 'official') - (q.origin.origin === 'official'); });
    var nb = ch.nbhd || (myB && myB.nbhd);
    var groups = [];
    if (mine.length) groups.push({ label: x.myBuilding + ': ' + myB.name, cards: mine });
    if (rest.length) groups.push({ label: rest.some(function (c) { return (c.sn.a.where || '').indexOf('Flemingdon') >= 0 && (c.sn.a.where || '').indexOf('Thorncliffe') >= 0; }) ? x.neighbourhoods : (s.neighbourhoods[nb || 'TP']), cards: rest });
    var heat = cards.some(function (c) { return c.sn.a.hazard === 'heat'; });
    var hu = (D.headsUps || []).filter(function (h) { return h.inSeason; })[0];
    var headsUp = null;
    if (ch.headsUp && hu && !heat) {
      var l = C.listingFor(hu.listing);
      headsUp = { actions: b.basic ? hu.actions.slice(0, 1) : hu.actions, guide: function () { go('R-25', { hazard: hu.hazard, stage: 'before' }); },
        showPlace: !b.basic && !!l, placeName: l ? l.name : '', place: function () { go('R-12', { id: hu.listing }); } };
    }
    var dests = [
      { icon: 'search', label: x.findHelp, line: x.findHelpLine, go: function () { go('R-09'); } },
      { icon: 'map', label: x.map, line: x.mapLine, go: function () { go('R-14'); } },
      { icon: 'ready', label: x.beReady, line: x.beReadyLine, go: function () { go('R-24'); } }
    ];
    var ambRec = (D.ambassadors || []).filter(function (x) { return (b.persona || {}).role === 'ambassador' && x.name === b.persona.name; })[0];
    var amb = ambRec ? { line: C.fill(x.ambassadorLine || '', { building: (C.building(ambRec.buildings[0]) || {}).name }), go: function () { go('A-01'); } } : null;
    return { amb: amb, groups: groups, nothing: cards.length === 0, noBuilding: !myB, headsUp: headsUp, dests: dests,
      showGetAlerts: !ch.subscribed && !ch.pendingPhone, showPending: !ch.subscribed && !!ch.pendingPhone,
      toSignup: function () { go('R-05'); }, toWhere: function () { go('R-35', { from: 'home' }); }, toArchive: function () { go('R-08'); } };
  }

}
</script>
</body>
</html>
